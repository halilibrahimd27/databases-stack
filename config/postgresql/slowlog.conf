# =============================================================================
# PostgreSQL — YAVAŞ SORGU ÖLÇÜMÜ (pg_stat_statements)
# =============================================================================
# Bu dosyayı postgres KENDİLİĞİNDEN OKUMAZ. postgresql.conf'un sonuna şu
# satır yazıldığında okunur:
#
#     include_if_exists = '/etc/postgresql/slowlog.conf'
#
# O satırı ./scripts/slowlog.sh kur postgresql yazar; dosyanın container'a
# bağlanması docker-compose.yml'deki tek mount satırıyla olur.
#
# NEDEN AYRI BİR DOSYA (compose'a `-c` olarak yazmak yerine):
# shared_preload_libraries POSTMASTER parametresidir — sunucu AÇILIRKEN
# okunur, sonradan değiştirilemez. Yani hangi yolu seçersek seçelim açmak
# yeniden başlatma ister. Ayrı dosyanın kazandırdığı şey, aşağıdaki beş
# ayarın TEK YERDE ve gerekçesiyle birlikte durması: compose'a beş `-c`
# satırı dağıtılsaydı, "neden track_utility kapalı" sorusunun cevabı
# hiçbir yerde yazmıyor olurdu.
#
# NEDEN include_if_exists, include DEĞİL:
# Bu dosya host'tan bind-mount ile geliyor. Depo taşınır, mount kaybolur ya
# da kullanıcı dosyayı siler; `include` o hâlde postgres'i AÇILIŞTA
# DÜŞÜRÜR. Ölçüm aracının bir ayar dosyası, veritabanının açılmasını
# engelleyemez — kaybolduğunda olması gereken tek şey ölçümün kapanması ve
# `slowlog.sh durum`un bunu SÖYLEMESİDİR.
#
# BURADAKİ DEĞERLER compose'daki `-c` satırlarını EZMEZ, tersi olur: komut
# satırı argümanları dosya ayarlarından önceliklidir. Bu yüzden buraya
# compose'da zaten geçilen hiçbir ayar (shared_buffers, work_mem…)
# yazılmadı — yazılsaydı sessizce yok sayılırdı.
# =============================================================================

# --- Ölçümün kendisi ---------------------------------------------------------
# pg_stat_statements sorgu metnini NORMALLEŞTİREREK sayar: sabitler $1, $2
# olur. Bu yüzden "aynı sorgunun 40.000 farklı parametreli koşumu" tek satır
# olarak birikir — asıl istediğimiz de bu, çünkü pahalı olan tek koşum değil
# TOPLAMDIR.
#
# EĞER BAŞKA BİR KÜTÜPHANE DE ÖN YÜKLENECEKSE virgülle buraya ekleyin:
#     shared_preload_libraries = 'pg_stat_statements,başka_kütüphane'
# Bu dosya postgresql.conf'un SONUNDA dahil edildiği için, ayarı başka bir
# yerde bırakıp burada da tanımlarsanız kazanan BURASI olur.
shared_preload_libraries = 'pg_stat_statements'

# Kaç ayrı sorgu ŞEKLİ saklanacak. Dolduğunda en az kullanılanlar atılır ve
# sunucu bunu pg_stat_statements_info.dealloc'ta sayar (slowlog.sh durum bu
# sayıyı okuyup söyler — atılma varsa liste eksik demektir).
# 5000 varsayılandır ve bilerek değiştirilmedi: her kayıt paylaşılan bellekte
# birkaç yüz bayt, sorgu METNİ ise ayrı bir dosyada tutulur. Asıl maliyet
# metin dosyasıdır ve o diskte; 5000 kayıt tipik bir uygulamanın tamamını
# kapsar.
pg_stat_statements.max = 5000

# 'top' = yalnız istemcinin GÖNDERDİĞİ sorgular sayılır.
# 'all' deseydik bir fonksiyonun içindeki her cümle de ayrı ayrı sayılırdı;
# o zaman aynı süre hem dış çağrıda hem iç cümlelerde görünür ve TOPLAM
# SÜRE sütunu gerçekte harcanandan büyük çıkardı. Sıralamamız toplam süreye
# göre olduğu için bu, listeyi doğrudan yanlış sıralardı.
pg_stat_statements.track = top

# GİZLİLİK AYARI — kapalı olmasının sebebi performans değil.
# pg_stat_statements yalnız SORGULARI normalleştirir; DDL/utility cümleleri
# (CREATE ROLE … PASSWORD '…', ALTER ROLE …, COPY … ) METNİYLE saklanır.
# Yani açık bırakılsaydı bu tabloda düz metin parola görülebilirdi ve
# `slowlog.sh durum` onu ekrana basardı. Ölçmek istediğimiz şey uygulamanın
# sorgu yükü; utility cümleleri o yükün parçası değil.
pg_stat_statements.track_utility = off

# Sayaçlar sunucu kapanışında diske yazılsın, açılışta geri okunsun.
# Kapalı olsaydı her yeniden başlatma ölçümü sıfırlardı ve "haftanın en
# pahalı sorgusu" diye bir şey ölçülemezdi — oysa asıl aranan tam olarak o.
pg_stat_statements.save = on

# queryid'yi her zaman hesapla. Varsayılan 'auto' zaten pg_stat_statements
# yüklüyken açar; 'on' yazmanın kazandırdığı şey queryid'nin
# pg_stat_activity ve log satırlarında da bulunması: "şu an asılı duran
# sorgu, listedeki hangi satır" sorusu ancak öyle cevaplanabiliyor.
compute_query_id = on
