# =============================================================================
# 6432 → bağlantı havuzu (PgBouncer)
# =============================================================================
# gateway/nginx.conf'un `stream` bloğu bu dizini include eder. Kardeş dosya
# state/routes.conf'u CONTROLLER üretir ve her devirde baştan yazar; buradaki
# kayıt ise değişmez. Üretilen dosyaya elle satır eklemek, bir sonraki devirde
# o satırın sessizce kaybolması demekti — o yüzden ayrı dosyada duruyor.
#
# Hedef bir DEĞİŞKENE atanıyor (routes.conf ile aynı desen). nginx,
# proxy_pass'te değişken görürse DNS'i açılışta değil İSTEK anında çözer.
# Sabit yazsaydık PostgreSQL kapalıyken pgbouncer container'ı da olmadığı için
# nginx "host not found in upstream" ile HİÇ AÇILMAZ ve gateway'den geçen
# BÜTÜN veritabanları erişilemez olurdu.
#
# Hedef pgbouncer'ın KENDİSİDİR, o an ana kopya olan düğüm değil: devirde yer
# değiştiren havuz değil, havuzun kendi hedefidir (docker-compose.yml →
# DB_HOST). Devirden sonra pgbouncer'ın yeniden yaratılması gerekir;
# gerekçesi docs/POOLING.md'de.
map $remote_addr $up_pgbouncer { default pgbouncer:6432; }

server {
    listen 6432;
    proxy_pass $up_pgbouncer;
}
