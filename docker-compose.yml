# =============================================================================
# databases-stack — TEK COMPOSE, PROFİL TABANLI AKTİVASYON
# =============================================================================
# `docker compose up -d`            → sadece çekirdek (gateway + controller +
#                                      adminer). Hiçbir veritabanı çalışmaz.
# `docker compose --profile mariadb up -d`  → MariaDB + phpMyAdmin + exporter
#
# Normalde profilleri elle yönetmezsiniz: dashboard'daki "Aktif Et" düğmesi
# controller üzerinden tam bu komutu çalıştırır (bkz. controller/app.py).
#
# ÖNEMLİ — BIND MOUNT YOLLARI: hepsi ${STACK_DIR} ile MUTLAK verilir. Controller
# compose'u kendi container'ının içinden çağırır; göreli yollar orada host'a göre
# değil container'a göre çözülüp bozulurdu. STACK_DIR'i install.sh .env'e yazar.
# =============================================================================

# Proje adı volume adlarının ön ekidir (<proje>_mariadb_data). Var olan bir
# kurulumdan geçiyorsanız install.sh eski adı algılayıp STACK_PROJECT'e yazar,
# böylece mevcut verileriniz aynı yerde kalır.
name: ${STACK_PROJECT:-databases-stack}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-svc: &svc
  restart: unless-stopped
  networks: [dbnet]
  logging: *logging

networks:
  dbnet:
    name: databases-stack_net
    driver: bridge

volumes:
  mariadb_data:
    # Kuşak işaretçisi — state/volumes.env. Varsayılan,
    # compose'un kendi ürettiği adın aynısı.
    name: ${MARIADB_DATA_VOLUME:-databases-stack_mariadb_data}
  mariadb_replica_data:
  postgresql_data:
    # Kuşak işaretçisi — state/volumes.env. Varsayılan,
    # compose'un kendi ürettiği adın aynısı.
    name: ${POSTGRESQL_DATA_VOLUME:-databases-stack_postgresql_data}
  postgresql_replica_data:
  mongodb_data:
    # Kuşak işaretçisi — state/volumes.env. Varsayılan,
    # compose'un kendi ürettiği adın aynısı.
    name: ${MONGODB_DATA_VOLUME:-databases-stack_mongodb_data}
  mongodb_replica_data:
  mongodb_arbiter_data:
  redis_data:
    # Kuşak işaretçisi — state/volumes.env. Varsayılan,
    # compose'un kendi ürettiği adın aynısı.
    name: ${REDIS_DATA_VOLUME:-databases-stack_redis_data}
  redis_replica_data:
  mssql_data:
    # Kuşak işaretçisi — state/volumes.env. Varsayılan,
    # compose'un kendi ürettiği adın aynısı.
    name: ${MSSQL_DATA_VOLUME:-databases-stack_mssql_data}
  cassandra_data:
  elasticsearch_data:
  elasticsearch_snapshots:
  kafka_data:
  rabbitmq_data:
  clickhouse_data:
  neo4j_data:
  minio_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
  redisinsight_data:

services:

  # ===========================================================================
  # ÇEKİRDEK — profili yok, her zaman çalışır
  # ===========================================================================

  # Tek giriş kapısı: TLS sonlandırma + basic auth + reverse proxy.
  # Panellerin kendi portları host'a AÇILMAZ; hepsi buradan geçer.
  gateway:
    <<: *svc
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"       # yalnız 443'e yönlendirir + /ca.crt
      - "${GATEWAY_HTTPS_PORT:-443}:443"    # dashboard + /api
      - "8081:8081"   # phpMyAdmin
      - "8082:8082"   # pgAdmin
      - "8083:8083"   # Mongo Express
      - "8084:8084"   # RedisInsight
      - "8085:8085"   # Adminer
      - "8086:8086"   # Kibana
      - "8087:8087"   # Kafka UI
      - "8088:8088"   # RabbitMQ Management
      - "8089:8089"   # MinIO Console
      - "8090:8090"   # Neo4j Browser
      - "8091:8091"   # ClickHouse Play
      - "8092:8092"   # Grafana (izleme)
      - "9443:9443"   # Prometheus scrape (tüm exporter'lar tek portta)
      # --- Veritabanı portları ---
      # Doğrudan container'a değil gateway'e bağlanılır: failover'da
      # arkadaki primary değişse bile uygulamanın adresi aynı kalır.
      - "${MARIADB_PORT:-3306}:3306"   # mariadb
      - "${POSTGRES_PORT:-5432}:5432"   # postgresql
      - "${PGBOUNCER_PORT:-6432}:6432"   # postgresql bağlantı havuzu
      - "${MONGO_PORT:-27017}:27017"   # mongodb
      - "${REDIS_PORT:-6379}:6379"   # redis
      - "${MSSQL_PORT:-1433}:1433"   # mssql
      - "${CASSANDRA_PORT:-9042}:9042"   # cassandra
      - "${ELASTIC_PORT:-9200}:9200"   # elasticsearch
      - "${KAFKA_PORT:-9092}:9092"   # kafka
      - "${RABBITMQ_PORT:-5672}:5672"   # rabbitmq
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # clickhouse
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"   # clickhouse
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # neo4j
      - "${MINIO_API_PORT:-9002}:9002"   # minio
      - "3307:3307"   # mariadb replikası
      - "5433:5433"   # postgresql replikası
      - "6380:6380"   # redis replikası
      - "27018:27018"   # mongodb replikası
    environment:
      # nginx resmi imajı /etc/nginx/templates/*.template dosyalarında envsubst
      # çalıştırır. FILTER olmadan $host / $uri gibi nginx değişkenleri de
      # ezilebilirdi; sadece STACK_ öneklileri değiştiriliyor.
      NGINX_ENVSUBST_FILTER: "^STACK_"
      STACK_CONTROLLER_TOKEN: ${CONTROLLER_TOKEN:?CONTROLLER_TOKEN gerekli — ./install.sh çalıştırın}
      STACK_RESOLVER: ${STACK_RESOLVER:-127.0.0.11}
      # Panel portları AYRI ORIGIN sayıldığı için tarayıcı, 443'te
      # girilen parolayı 8081-8092'ye taşımaz ve her panelde yeniden
      # sorar. Çerezler ise port değil HOST başına paylaşılır: panele
      # girince bırakılan bu imzalı çerez panel portlarında da gönderilir
      # ve orada parola sorulmaz. Değeri .env'den gelir; boşsa çerez
      # yolu kapanır ve her panel yine parola ister (güvenli varsayılan).
      STACK_PANEL_SSO: ${PANEL_SSO_TOKEN:-}
    volumes:
      - ${STACK_DIR:-.}/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      # Yönlendirme tablosu — controller üretir, failover'da yeniden yazar.
      - ${STACK_DIR:-.}/state/routes.conf:/etc/nginx/stream.d/routes.conf:ro
      # 6432 (bağlantı havuzu) AYRI bir dosyada, çünkü hedefi sabittir:
      # devirde yer değiştiren pgbouncer değil, pgbouncer'ın kendi
      # hedefidir. routes.conf'u controller her devirde yeniden yazıyor;
      # değişmeyen bir kaydı oraya koymak onu üretilen dosyaya bağımlı
      # kılardı.
      - ${STACK_DIR:-.}/config/gateway/stream-pgbouncer.conf:/etc/nginx/stream.d/pgbouncer.conf:ro
      - ${STACK_DIR:-.}/gateway/templates:/etc/nginx/templates:ro
      - ${STACK_DIR:-.}/gateway/snippets:/etc/nginx/snippets:ro
      - ${STACK_DIR:-.}/gateway/html:/usr/share/nginx/html:ro
      - ${STACK_DIR:-.}/gateway/empty.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STACK_DIR:-.}/certs:/etc/nginx/certs:ro
      - ${STACK_DIR:-.}/gateway/.htpasswd:/etc/nginx/.htpasswd:ro
      # Salt-okunur html mount'unun İÇİNE bağlanamaz (docker orada mountpoint
      # yaratamaz). Ayrı yola bağlanıp nginx'te alias ile sunuluyor.
      - ${STACK_DIR:-.}/catalog.json:/etc/nginx/catalog.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # Kontrol düzlemi. Dashboard'un "Aktif Et / Durdur" düğmeleri buraya gider;
  # o da docker soketi üzerinden `docker compose --profile X up -d` çalıştırır.
  # Host'a PORT AÇMAZ — yalnızca gateway üzerinden, token ile erişilir.
  controller:
    <<: *svc
    build:
      context: ./controller
    image: databases-stack/controller:1.0
    container_name: controller
    environment:
      BACKEND: ${CONTROLLER_BACKEND:-docker}
      COMPOSE_PROJECT: ${STACK_PROJECT:-databases-stack}
      STACK_DIR: ${STACK_DIR:-}
      CONTROLLER_TOKEN: ${CONTROLLER_TOKEN:?CONTROLLER_TOKEN gerekli}
      CATALOG_PATH: /project/catalog.json
      STATE_PATH: /project/state/active-profiles
      LOG_LEVEL: ${CONTROLLER_LOG_LEVEL:-info}
      # Otomatik devir denetleyicisi
      FAILOVER_INTERVAL: ${FAILOVER_INTERVAL:-10}
      FAILOVER_STRIKES: ${FAILOVER_STRIKES:-3}
      FAILOVER_COOLDOWN: ${FAILOVER_COOLDOWN:-300}
      NOTIFY_WEBHOOK: ${NOTIFY_WEBHOOK:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Stack dizininin TAMAMI /project'e bağlanır. Tek tek dosya bağlamak
      # yerine böyle: compose dosyayı yüklerken `build: ./controller` gibi
      # göreli yolları da çözebilmeli, yoksa "build context not found" der.
      # State dizini üstüne rw olarak tekrar bağlanır (iç içe mount).
      - ${STACK_DIR:-.}:/project:ro
      - ${STACK_DIR:-.}/state:/project/state
      - ${STACK_DIR:-.}/overrides:/project/overrides:ro
      # Yedek dosyalarını ve yedek günlüğünü CONTROLLER yazıyor (zamanlanmış
      # yedek onun içinde koşan scripts/backup.sh ile alınıyor). /project ro
      # bağlı olduğu için bu iki dizin ayrıca rw bağlanmasa dump'lar
      # "Read-only file system" ile ölürdü; üstelik hatanın kendisi de
      # logs/ altına yazılamayacağı için ortada iz bile kalmazdı.
      - ${STACK_DIR:-.}/backups:/project/backups
      - ${STACK_DIR:-.}/logs:/project/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M

  # Evrensel DB istemcisi — MySQL/PostgreSQL/MSSQL/SQLite/ClickHouse hepsi.
  # 128M olduğu için profile bağlanmadı; MSSQL'in tek paneli de bu.
  adminer:
    <<: *svc
    image: adminer:4.8.1
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
      ADMINER_DESIGN: dracula
    healthcheck:
      # Adminer imajında wget/curl YOK — PHP ile kontrol ediyoruz. Bu aynı
      # zamanda daha iyi bir test: gerçekten HTTP sunucusuna istek atıyor.
      test:
        - CMD-SHELL
        - >-
          php -r 'exit(@file_get_contents("http://127.0.0.1:8080/") === false ? 1 : 0);'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================================================
  # MARIADB   —   profile: mariadb
  # ===========================================================================
  mariadb:
    <<: *svc
    profiles: [mariadb]
    image: ${MARIADB_IMAGE:-mariadb:${MARIADB_VERSION:-11.4}}
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD:-${DB_PASSWORD}}
      MARIADB_DATABASE: ${DEFAULT_DATABASE:-defaultdb}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
      # STATİK ayarlar my.cnf'te. Bellekle ÖLÇEKLENEN üç ayar aşağıda command
      # ile geçilir; controller bunları host RAM'ine göre hesaplayıp
      # state/tuning.env'e yazar. (Eski compose'daki `command:` bloğu my.cnf'in
      # tamamını eziyordu — burada yalnız bu üç anahtar override edilir.)
      - ${STACK_DIR:-.}/config/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      # --- PITR: binlog arşiv KOPYASI (docs/PITR.md) ------------------------
      # BİNLOG'UN KENDİSİ BURAYA YAZILMAZ, buraya KOPYALANIR
      # (./scripts/pitr.sh arsivle mariadb).
      # log_bin yolunu buraya taşımak cazip görünüyor ama yıkıcı: MariaDB
      # hangi binlog'ların var olduğunu mysql-bin.index dosyasından bilir ve
      # PURGE'ü ona göre yapar. Yol değişince yeni bir index açılır, datadir'de
      # kalan eski dosyalar hiçbir zaman silinmez —
      # binlog_expire_logs_seconds onları artık görmez. Sessizce dolan bir
      # veri hacmi, çözmeye çalıştığımız sorunun daha kötüsü olurdu.
      # Kopya ise host'ta durur: motorun hacmi ölse bile binlog elde kalır ve
      # arşiv, yedeklerle aynı saklama politikasına girer.
      - ${STACK_DIR:-.}/backups/mariadb/binlog:/binlog-archive
    command:
      - "--server-id=${MARIADB_SERVER_ID:-1}"
      - "--read-only=${MARIADB_READ_ONLY:-OFF}"
      - "--innodb-buffer-pool-size=${MARIADB_BUFFER_POOL:-1G}"
      - "--innodb-log-file-size=${MARIADB_LOG_FILE_SIZE:-256M}"
      - "--max-connections=${MARIADB_MAX_CONNECTIONS:-200}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MARIADB_MEM_LIMIT:-8G}

  phpmyadmin:
    <<: *svc
    profiles: [mariadb]
    image: phpmyadmin:5.2
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${STACK_HOST:-localhost}:8081/
      UPLOAD_LIMIT: 128M
      MAX_EXECUTION_TIME: 600
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  mariadb-exporter:
    <<: *svc
    profiles: [mariadb]
    image: prom/mysqld-exporter:v0.15.1
    container_name: mariadb-exporter
    environment:
      # Yeni mysqld-exporter parolayı DATA_SOURCE_NAME'den DEĞİL bu env'den okur;
      # yoksa "using password: NO" → Access denied → mysql_up=0.
      MYSQLD_EXPORTER_PASSWORD: ${MARIADB_PASSWORD:-${DB_PASSWORD}}
    command:
      # Adres SABİT DEĞİL: devirden sonra ana kopya mariadb-replica olur ve
      # sabit adres fence edilmiş düğümü göstermeye devam ederdi — mysql_up=0,
      # o motorun bütün grafikleri boş. roles.env'i controller yazar.
      - "--mysqld.address=${MARIADB_PRIMARY_HOST:-mariadb}:3306"
      - "--mysqld.username=root"
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  # --- MariaDB replikası (profile: mariadb-replica) --------------------------
  # Ayağa kalkar ama kendiliğinden bağlanmaz; primary'e bağlama işini
  # scripts/replication/mariadb.sh yapar (controller bunu çağırır).
  mariadb-replica:
    <<: *svc
    profiles: [mariadb-replica]
    image: ${MARIADB_IMAGE:-mariadb:${MARIADB_VERSION:-11.4}}
    container_name: mariadb-replica
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD:-${DB_PASSWORD}}
      MARIADB_AUTO_UPGRADE: "1"
    command: >
      --server-id=${MARIADB_REPLICA_SERVER_ID:-2}
      --read-only=${MARIADB_REPLICA_READ_ONLY:-ON}
      --relay-log=relay-bin
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-strict-mode=ON
      --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL:-1G}
      --innodb-log-file-size=${MARIADB_LOG_FILE_SIZE:-256M}
      --max-connections=${MARIADB_MAX_CONNECTIONS:-200}
    volumes:
      - mariadb_replica_data:/var/lib/mysql
      # ANA KOPYAYLA AYNI my.cnf. Eksikken ölçülen sonuç: devirden sonra bu
      # düğüm ana kopya oluyor ve yığının bütün ayarlarını KAYBEDİYOR —
      # binlog_expire_logs_seconds (binlog bir daha hiç silinmez, disk dolar),
      # slow_query_log (yavaş sorgu ölçümü susar), bağlantı başına buffer
      # sınırları, innodb_flush_log_at_trx_commit… Hiçbiri hata vermez;
      # sunucu stok varsayılanlarla çalışmaya devam eder ve fark yalnız
      # aylar sonra bir performans/disk olayı olarak görünür.
      # Replikaya özel ayarlar (server-id, read-only, log-bin) command:
      # satırında duruyor ve komut satırı config dosyasını EZER — yani bu
      # bağlama onları bozmaz.
      - ${STACK_DIR:-.}/config/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      # BİNLOG ARŞİVİ REPLİKADA DA ŞART. Devirden sonra ana kopya BU düğüm
      # olur ve yazmaları o üretir; bağlama yalnız 'mariadb' servisinde
      # kalırsa PITR tam da en gerekli anda — devirden sonra — sessizce
      # çalışmaz olur: arşive hiçbir şey düşmez, "ne kadar geriye
      # dönebilirim" penceresi devir anında donar. e2e/pitr.sh bunu
      # "mariadb-replica container'ında /binlog-archive bağlaması yok"
      # diyerek yakaladı.
      - ${STACK_DIR:-.}/backups/mariadb/binlog:/binlog-archive
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MARIADB_REPLICA_MEM_LIMIT:-${MARIADB_MEM_LIMIT:-8G}}

  # ===========================================================================
  # POSTGRESQL   —   profile: postgresql
  # ===========================================================================
  postgresql:
    <<: *svc
    profiles: [postgresql]
    image: ${POSTGRES_IMAGE:-postgres:${POSTGRES_VERSION:-16}}
    container_name: postgresql
    environment:
      POSTGRES_DB: ${DEFAULT_DATABASE:-defaultdb}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Rol: boş = primary. Devirden sonra controller burayı doldurup bu
      # düğümü yeni primary'nin yedeği yapar (state/roles.env üzerinden).
      PG_STANDBY_OF: ${POSTGRES_STANDBY_OF:-}
      PG_SLOT: ${POSTGRES_SLOT_PRIMARY:-replica_from_primary}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-${POSTGRES_PASSWORD:-${DB_PASSWORD}}}
      # archive_command postmaster'ın çocuğu olarak koşar ve ortamı ondan
      # devralır; yolu betiğe böyle geçiyoruz. Yol iki yerde (compose mount'u
      # ve betik) sabit yazılsaydı, birini değiştirip diğerini unutmak
      # arşivlemeyi sessizce durdururdu.
      PG_WAL_ARSIV: /wal-archive
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      # --- PITR (docs/PITR.md) ---------------------------------------------
      # WAL arşivi YIĞININ KENDİ DİZİNİNDE, yedeklerin yanında:
      # host'ta backups/postgresql/wal. Docker hacmine yazsaydık arşiv
      # `docker volume ls` dışında görünmez olurdu; oysa arşiv yedeklerle
      # AYNI saklama politikasına tabi (scripts/pitr.sh temizle) ve aynı
      # disk doluluk uyarısına girmek zorunda — sessizce dolan bir WAL
      # arşivi, PostgreSQL'i PANIC ile durduran arıza sınıfının kendisi.
      - ${STACK_DIR:-.}/backups/postgresql/wal:/wal-archive
      # archive_command / restore_command betikleri. Salt okunur: arşivleme
      # yolundaki bir betiği motorun kendisi değiştirebilseydi, kurtarmanın
      # doğruluğu container'ın bütünlüğüne bağlı olurdu.
      - ${STACK_DIR:-.}/config/postgresql:/etc/pitr:ro
      # --- Yavaş sorgu ölçümü (docs/SLOWLOG.md) -----------------------------
      # pg_stat_statements'ı açan ayar dosyası. TEK DOSYA olarak bağlanıyor,
      # yukarıdaki /etc/pitr dizin bağlaması yeniden kullanılmıyor: o mount
      # PITR'a ait ve PITR kapatıldığı gün oradan kaldırılabilir; yavaş sorgu
      # ölçümünün o kararla birlikte sessizce ölmesi kabul edilemez. Ayrı ad,
      # ayrı ömür.
      #
      # BAĞLI OLMASI ÖLÇÜMÜ AÇMAZ. Dosya postgresql.conf'a bir
      # `include_if_exists` satırı yazılana kadar okunmaz; o satırı
      #     ./scripts/slowlog.sh kur postgresql
      # yazar ve YENİDEN BAŞLATMA gerektiğini söyler (shared_preload_libraries
      # postmaster parametresidir, reload yetmez). Buraya doğrudan
      # `-c shared_preload_libraries=…` yazmadık: o zaman ölçüm herkeste açık
      # gelirdi ve "açtım" diyen komutun yapacak bir işi kalmazdı.
      - ${STACK_DIR:-.}/config/postgresql/slowlog.conf:/etc/postgresql/slowlog.conf:ro
    # ROL SABİT DEĞİL — PG_STANDBY_OF ile belirlenir:
    #   boş     → bu düğüm PRIMARY
    #   dolu    → o düğümden klonlanıp STANDBY olarak açılır
    # Devirden sonra eski primary'yi yeni primary'nin yedeği yapabilmek için
    # şart. Sabit "primary" tanımı olsaydı, geri alırken boş bir ikinci
    # primary olarak açılır ve replikasyon kurulamazdı.
    # Replika servisi de aynı entrypoint'i kullanır; ikisi simetriktir.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ -n "$${PG_STANDBY_OF:-}" ] && [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo "[rol] STANDBY olarak kuruluyor, kaynak: $$PG_STANDBY_OF"
          export PGPASSWORD="$${POSTGRES_REPLICATION_PASSWORD:-$$POSTGRES_PASSWORD}"
          until pg_isready -h "$$PG_STANDBY_OF" -U "$${POSTGRES_REPLICATION_USER:-replicator}" -q; do
            echo "[rol] kaynak bekleniyor: $$PG_STANDBY_OF"; sleep 2
          done
          rm -rf "$$PGDATA"; mkdir -p "$$PGDATA"; chmod 700 "$$PGDATA"
          pg_basebackup -h "$$PG_STANDBY_OF" -U "$${POSTGRES_REPLICATION_USER:-replicator}" \
            -D "$$PGDATA" -Fp -Xs -P -R -S "$$PG_SLOT" -C
          echo "[rol] klon tamam"
        fi
        exec docker-entrypoint.sh "$$@"
      - bash
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-1536MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKERS:-8}
      - -c
      - max_locks_per_transaction=${POSTGRES_MAX_LOCKS:-64}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - log_min_duration_statement=2000
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      # --- PITR: WAL arşivleme (docs/PITR.md) -------------------------------
      # wal_level=replica YETERLİDİR; PITR ayrı bir seviye istemez (logical
      # daha fazlasını yazar ve diski boşuna şişirir). Eksik olan tek şey
      # arşivlemeydi: replica seviyesi WAL'ı ÜRETİR ama pg_wal dolunca geri
      # dönüştürür — yani "dün 14:32" o segment geri dönüştürüldüğü anda
      # ulaşılamaz olur. archive_mode onu kalıcı bir dosyaya kopyalatır.
      #
      # archive_mode DEĞİŞİKLİĞİ YENİDEN BAŞLATMA İSTER (reload yetmez):
      # bu satırı ekledikten sonra `docker compose up -d postgresql` şart.
      # ./scripts/pitr.sh durum postgresql bunu ölçer ve söyler.
      #
      # KAPATMAK İÇİN .env'e POSTGRES_ARCHIVE_MODE=off yazın. Kapatmak PITR'ı
      # bitirir ama arşiv dizinine yazamayan bir kurulumda pg_wal'ın veri
      # diskini doldurmasından iyidir; bu kaçış yolu bilerek var.
      - -c
      - archive_mode=${POSTGRES_ARCHIVE_MODE:-on}
      - -c
      - archive_command=sh /etc/pitr/wal-archive.sh %p %f
      # Boştaki bir veritabanında segment dolmaz; arşive hiçbir şey düşmez ve
      # "en yeni dönülebilir an" saatlerce geride kalır. archive_timeout, YAZI
      # OLMUŞSA segmenti zorla kapatır — yani RPO'nun üst sınırı budur.
      # 300 sn'nin bedeli: yazı olan her 5 dakikada bir, yarısı boş olsa da
      # TAM BOYUTLU (16 MB) bir segment arşive düşer. Sürekli yazılan bir
      # sunucuda bu zaten olurdu; boştakinde ise hiç olmaz (PostgreSQL yazı
      # yoksa segment değiştirmez), o yüzden sabit bir disk maliyeti değil.
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-300}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${DEFAULT_DATABASE:-defaultdb}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        # 200 bağlantı × work_mem, 1G'ye sığmıyordu — 2G tabana çekildi.
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-2G}

  pgadmin:
    <<: *svc
    profiles: [postgresql]
    image: dpage/pgadmin4:8.12
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-${DB_PASSWORD}}
      # Server mode = login zorunlu. "False" olsaydı panel şifresiz açılırdı.
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
      PGADMIN_LISTEN_PORT: 80
    volumes:
      # Named volume — bind mount host'ta root'a ait olup pgadmin (uid 5050)
      # yazamıyor, worker crash-loop'a giriyordu.
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  postgres-exporter:
    <<: *svc
    profiles: [postgresql]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      # Parola URI'ye gömülmüyor: özel karakter (@ : / ?) içeren parolalar
      # DATA_SOURCE_NAME'i sessizce bozuyordu.
      # Devirden sonra ana kopya değişir; sabit adres eski düğümde kalırdı.
      DATA_SOURCE_URI: "${POSTGRES_PRIMARY_HOST:-postgresql}:5432/${DEFAULT_DATABASE:-defaultdb}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-root}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-${DB_PASSWORD}}
    command:
      # postmaster toplayıcısı VARSAYILAN OLARAK KAPALIDIR; açılmazsa
      # pg_postmaster_start_time_seconds hiç üretilmez ve "kesintisiz çalışma
      # süresi" paneli sonsuza dek boş kalır. Panelde boş kutu görmek,
      # kullanıcının izlemeye olan güvenini en hızlı yitiren şeydir.
      - "--collector.postmaster"
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  # --- Bağlantı havuzu (profile: postgresql) ---------------------------------
  # NEDEN VAR: PostgreSQL'de her bağlantı ayrı bir SÜREÇTİR. Havuz kullanmayan
  # bir uygulama (PHP-FPM, cron işleri, kısa ömürlü işçiler) 200 bağlantı
  # açtığında motoru belleğiyle değil SÜREÇ SAYISIYLA boğar: shared_buffers ve
  # work_mem hesabı doğru yapılmış 2 GB'lık bir PostgreSQL, "RAM yetiyor"
  # derken cevap veremez hale gelir. PgBouncer araya girer ve binlerce
  # istemciyi onlarca sunucu bağlantısına indirger.
  #
  # NEDEN YENİ PORT (6432), NEDEN 5432'NİN ÜSTÜNE DEĞİL:
  #  1) 5432 replikasyonun ve devrin ÖLÇÜLEN yoludur (scripts/e2e/failover.sh
  #     oradan bağlanır). O portu havuza çevirmek testlerin doğruladığı yolu
  #     değiştirir; ürün artık kullanıcının kullandığı yolu sınamıyor olurdu.
  #  2) Transaction pooling oturum durumunu KORUMAZ. SQL düzeyinde PREPARE,
  #     LISTEN/NOTIFY, oturum değişkenleri ve geçici tablolar kullanan
  #     istemciler yük altında SESSİZCE bozulur — havuzu varsayılan yapmak,
  #     çalışan kurulumları haber vermeden kırmak olurdu.
  # Bu yüzden 5432 doğrudan bağlantı olarak KALIR, 6432 isteyene açıktır.
  # Ayrıntı: docs/POOLING.md
  pgbouncer:
    <<: *svc
    profiles: [postgresql]
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:${PGBOUNCER_VERSION:-v1.25.2-p0}}
    container_name: pgbouncer
    environment:
      # HEDEF ANA KOPYADIR VE DEVİRDE DEĞİŞİR. Adres, container yaratılırken
      # pgbouncer.ini'ye YAZILIR; çalışan container env'i yeniden okumaz. Yani
      # devirden sonra bu servis YENİDEN YARATILMALIDIR:
      #   docker compose --profile postgresql up -d --force-recreate \
      #                  --no-deps pgbouncer
      # Yapılmazsa havuz, fence edilmiş eski ana kopyaya bakmaya devam eder ve
      # 6432'ye bağlanan uygulamalar için devir hiç olmamış gibi görünür.
      # roles.env'i controller yazar (postgres-exporter ile aynı değişken).
      DB_HOST: ${POSTGRES_PRIMARY_HOST:-postgresql}
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-root}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      # DB_NAME BİLEREK VERİLMİYOR: imaj onu görmezse `*` (joker) veritabanı
      # girdisi üretir ve havuz her veritabanı adını aynı sunucuya taşır. Sabit
      # bir ad yazsaydık kullanıcının sonradan açtığı veritabanları 6432'den
      # erişilemez olurdu — ve hata mesajı bunu söylemezdi.
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      # PostgreSQL scram-sha-256 ile kuruluyor (POSTGRES_INITDB_ARGS). İmajın
      # varsayılanı md5'tir; bırakılsaydı havuz sunucuya giriş yapamazdı.
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER:-root}
      # PgBouncer, sunucuya AKTARAMADIĞI başlangıç parametrelerini gönderen
      # istemciyi reddeder. extra_float_digits'i neredeyse her sürücü,
      # `options`u ise JDBC gönderir; listeye alınmazsa bağlantı hiç kurulmaz.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      # Havuz ayarlarının türetildiği sayı (aşağıdaki entrypoint hesaplar).
      # Değeri controller host RAM'ine göre bulup state/tuning.env'e yazar;
      # katalogda per_gb 100, alt/üst sınır 50–400.
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-200}
    # HAVUZ AYARLARI max_connections'TAN TÜRETİLİR — sabit yazılamaz.
    # Sabit bir default_pool_size, sunucunun kabul ettiğinden fazla bağlantı
    # açmaya çalışan bir havuz üretebilirdi; o zaman havuz sorunu çözmez,
    # "FATAL: sorry, too many clients already" hatasını uygulamadan alıp
    # kendi üstüne taşır — üstelik artık hata veren tek nokta havuzdur.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        MAXC="$${POSTGRES_MAX_CONNECTIONS:-200}"
        # Havuzun sunucuda tutabileceği bağlantı max_connections'ın YARISINI
        # aşmaz. Kalan yarı doğrudan 5432'ye bağlananlara, pgAdmin'e,
        # postgres-exporter'a ve yedek alan pg_dump'a kalmalıdır; havuz
        # onların yerini kapatırsa panelden veritabanına bakamaz, yedek
        # alamaz hale gelirsiniz. İki tavan birlikte: ROL başına ve
        # VERİTABANI başına %50. PgBouncer'da genel bir üst sınır yoktur;
        # bu ikisi, "tek rol + çok veritabanı" ve "tek veritabanı + çok rol"
        # durumlarının ikisini de %50'de tutar.
        MAX_USER_CONNECTIONS=$$(( MAXC / 2 ))
        MAX_DB_CONNECTIONS=$$(( MAXC / 2 ))
        # Tek bir (kullanıcı, veritabanı) havuzu %25'ten fazlasını almasın:
        # aynı motoru paylaşan ikinci bir uygulama bağlantı bulamaz olmasın.
        DEFAULT_POOL_SIZE=$$(( MAXC / 4 ))
        if [ "$$DEFAULT_POOL_SIZE" -lt 5 ]; then DEFAULT_POOL_SIZE=5; fi
        # İstemci tarafı BOL — havuzun bütün anlamı burada: PgBouncer'da bir
        # istemci ~8 KB tampon (2 x pkt_buf), PostgreSQL'de ise bir süreçtir.
        # 5 kat, tepe anında istemcinin bağlantı REDDİ almak yerine sıraya
        # girmesini sağlar (query_wait_timeout varsayılanı 120 sn).
        MAX_CLIENT_CONN=$$(( MAXC * 5 ))
        export DEFAULT_POOL_SIZE MAX_USER_CONNECTIONS MAX_DB_CONNECTIONS
        export MAX_CLIENT_CONN
        echo "[havuz] max_connections=$$MAXC -> pool=$$DEFAULT_POOL_SIZE" \
             "rol=$$MAX_USER_CONNECTIONS db=$$MAX_DB_CONNECTIONS" \
             "istemci=$$MAX_CLIENT_CONN"
        exec /entrypoint.sh "$$@"
      - sh
    command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      # Bu kontrol HAVUZUN KENDİ SÜRECİNİ ölçer, arkadaki PostgreSQL'i DEĞİL.
      # Ölçüldü: motor durdurulmuşken de "accepting connections" der, çünkü
      # pgbouncer istemciyi kabul edip sıraya alır. Bilerek böyle: motorun
      # sağlığı zaten postgresql servisinin healthcheck'inde ölçülüyor ve
      # burada ikinci kez ölçmek, havuz sapasağlam ayaktayken onu "hasta"
      # gösterip gereksiz yeniden başlatma üretirdi.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-root} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # Ölçüm: boşta 1.9 MiB (docker stats). PgBouncer TEK SÜREÇ ve tek
          # iş parçacığıdır; büyüyen tek kalem istemci başına ~8 KB tampon →
          # 1000 istemcide ~8 MB. 64 MB ölçülen kullanımın kat kat üstünde ve
          # exporter'larla aynı sınıf; motorun bütçesinden çaldığı pay ihmal
          # edilebilir.
          memory: ${PGBOUNCER_MEM_LIMIT:-64M}

  # --- PostgreSQL replikası (profile: postgresql-replica) --------------------
  postgresql-replica:
    <<: *svc
    profiles: [postgresql-replica]
    image: ${POSTGRES_IMAGE:-postgres:${POSTGRES_VERSION:-16}}
    container_name: postgresql-replica
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      # Varsayılan rol: 'postgresql' düğümünün yedeği. Devirden sonra bu düğüm
      # primary olur ve controller burayı BOŞALTIR (state/roles.env).
      PG_STANDBY_OF: ${POSTGRES_REPLICA_STANDBY_OF-postgresql}
      PG_SLOT: ${POSTGRES_REPLICATION_SLOT:-replica_1}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-${POSTGRES_PASSWORD:-${DB_PASSWORD}}}
    volumes:
      - postgresql_replica_data:/var/lib/postgresql/data
      # PITR — ANA KOPYAYLA AYNI ARŞİV. Bu üç satır eksikken ölçülen sonuç:
      # devirden sonra bu düğüm ana kopya oluyor, ama archive_command da
      # /wal-archive de yok — WAL arşivlemesi SESSİZCE duruyor. `pitr.sh
      # durum` "archive_mode KAPALI" diyor ve dönülebilir pencerenin üst
      # sınırı devir anına donuyor. Yani PITR tam da en çok ihtiyaç duyulan
      # anda, bir olayın hemen ardından ölüyor. (MariaDB tarafında aynı hata
      # /binlog-archive bağlaması eksikken yaşandı.)
      - ${STACK_DIR:-.}/backups/postgresql/wal:/wal-archive
      - ${STACK_DIR:-.}/config/postgresql:/etc/pitr:ro
      # Yavaş sorgu ölçümü de devirden sonra ölmesin: slowlog.sh bu dosyayı
      # postgresql.conf'tan include ediyor, bağlı değilse "container'a BAĞLI
      # DEĞİL" deyip ölçümü açamıyor.
      - ${STACK_DIR:-.}/config/postgresql/slowlog.conf:/etc/postgresql/slowlog.conf:ro
    # Primary ile AYNI entrypoint — rol yalnızca PG_STANDBY_OF ile belirlenir.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ -n "$${PG_STANDBY_OF:-}" ] && [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo "[rol] STANDBY olarak kuruluyor, kaynak: $$PG_STANDBY_OF"
          export PGPASSWORD="$${POSTGRES_REPLICATION_PASSWORD:-$$POSTGRES_PASSWORD}"
          until pg_isready -h "$$PG_STANDBY_OF" -U "$${POSTGRES_REPLICATION_USER:-replicator}" -q; do
            echo "[rol] kaynak bekleniyor: $$PG_STANDBY_OF"; sleep 2
          done
          rm -rf "$$PGDATA"; mkdir -p "$$PGDATA"; chmod 700 "$$PGDATA"
          pg_basebackup -h "$$PG_STANDBY_OF" -U "$${POSTGRES_REPLICATION_USER:-replicator}"             -D "$$PGDATA" -Fp -Xs -P -R -S "$$PG_SLOT" -C
          echo "[rol] klon tamam"
        fi
        exec docker-entrypoint.sh "$$@"
      - bash
    command:
      - postgres
      - -c
      - hot_standby=on
      # Standby'ın bu üç değeri primary'den KÜÇÜK OLAMAZ; küçükse PostgreSQL
      # kurtarmayı reddeder ve container crash-loop'a girer.
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKERS:-8}
      - -c
      - max_locks_per_transaction=${POSTGRES_MAX_LOCKS:-64}
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      # Planlayıcı ayarı ANA KOPYAYLA AYNI olmalı. Yoksa devirden sonra
      # yükseltilen düğüm, kendisinde olmayan bir önbelleği (PostgreSQL
      # varsayılanı 4GB) varsayıp kötü plan seçer — oysa container limiti
      # ~2.4 GB. Bu ürün replikaya ana kopya kadar bellek ayırıyor çünkü
      # "devirden sonra aynı yükü taşıyacak"; ayarların da öyle olması lazım.
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-1536MB}
      - -c
      - log_min_duration_statement=2000
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - wal_level=replica
      # archive_mode=on: STANDBY iken PostgreSQL arşivlemez (yalnız "always"
      # öyle yapar); yükseltildiği anda arşivlemeye başlar. İstediğimiz tam
      # olarak bu — replikasyon sürerken iki düğüm aynı segment adlarını
      # arşive yazmasın, devirden sonra yeni zaman çizgisiyle (00000002…)
      # kaldığı yerden devam etsin.
      - -c
      - archive_mode=${POSTGRES_ARCHIVE_MODE:-on}
      - -c
      - archive_command=sh /etc/pitr/wal-archive.sh %p %f
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-300}
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_REPLICA_MEM_LIMIT:-${POSTGRES_MEM_LIMIT:-2G}}

  # ===========================================================================
  # MONGODB   —   profile: mongodb
  # ===========================================================================
  mongodb:
    <<: *svc
    profiles: [mongodb]
    image: ${MONGO_IMAGE:-mongo:${MONGO_VERSION:-7.0}}
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-${DB_PASSWORD}}
      MONGO_INITDB_DATABASE: ${DEFAULT_DATABASE:-defaultdb}
    volumes:
      - mongodb_data:/data/db
    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_WIREDTIGER_CACHE_GB:-1}"
    healthcheck:
      # mongosh 5.0+ ile geldi; 4.4 kullanıyorsanız MONGO_SHELL=mongo yapın.
      test: ["CMD-SHELL", "${MONGO_SHELL:-mongosh} --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEM_LIMIT:-2G}

  mongo-express:
    <<: *svc
    profiles: [mongodb]
    image: mongo-express:1.0.2
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-${DB_PASSWORD}}@mongodb:27017/?authSource=admin"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      # KRİTİK: eskiden "false" idi → 8083'e ulaşan herkes MongoDB'de root'tu.
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${PANEL_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${PANEL_PASSWORD:-${DB_PASSWORD}}
      ME_CONFIG_OPTIONS_EDITORTHEME: "ambiance"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # Eski hali `|| exit 0` ile biterdi → healthcheck DAİMA "healthy" derdi.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M

  mongodb-exporter:
    <<: *svc
    profiles: [mongodb]
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    environment:
      MONGODB_URI: "mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-${DB_PASSWORD}}@mongodb:27017/?authSource=admin"
    command:
      - "--collect-all"
      - "--web.listen-address=:9216"
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  # --- MongoDB replica set üyesi (profile: mongodb-replica) ------------------
  mongodb-replica-1:
    <<: *svc
    profiles: [mongodb-replica]
    image: ${MONGO_IMAGE:-mongo:${MONGO_VERSION:-7.0}}
    container_name: mongodb-replica-1
    volumes:
      - mongodb_replica_data:/data/db
      - ${STACK_DIR:-.}/state/mongo-keyfile:/etc/mongo-keyfile:ro
    command:
      - mongod
      - --replSet
      - ${MONGO_REPLICA_SET:-rs0}
      - --bind_ip_all
      - --keyFile
      - /etc/mongo-keyfile
      # ÖNBELLEK TAVANI BURADA DA OLMALI. Yoksa bu düğüm MongoDB'nin
      # varsayılanıyla açılır: (RAM − 1 GB) / 2. 16 GB'lık bir sunucuda bu
      # 7.5 GB eder — yani panelin bütün bellek muhasebesinin dışında,
      # controller'ın hesapladığı tavanın kat kat üstünde. Replica set'te
      # ana kopya KENDİLİĞİNDEN değişir; o an bu düğüm ana kopya olur ve
      # sunucu, kimsenin istemediği bir belleği ayırmaya başlar.
      - --wiredTigerCacheSizeGB
      - ${MONGO_WIREDTIGER_CACHE_GB:-1}
    healthcheck:
      test: ["CMD-SHELL", "${MONGO_SHELL:-mongosh} --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${MONGO_REPLICA_MEM_LIMIT:-${MONGO_MEM_LIMIT:-2G}}

  # MongoDB'de otomatik failover ÇOĞUNLUK ister. İki üyeyle biri düşünce
  # çoğunluk (2/2 → 1/2) kaybolur ve seçim yapılamaz; kalan üye SECONDARY'de
  # kilitlenir. Arbiter üçüncü OY olarak katılır (veri tutmaz, ~64 MB yeter).
  # NOT: P-S-A topolojisinde secondary düşerse w:"majority" yazmalar bekler —
  # varsayılan w:1 kullanan uygulamalar etkilenmez (bkz. docs/FAILOVER.md).
  mongodb-arbiter:
    <<: *svc
    profiles: [mongodb-replica]
    image: ${MONGO_IMAGE:-mongo:${MONGO_VERSION:-7.0}}
    container_name: mongodb-arbiter
    volumes:
      - mongodb_arbiter_data:/data/db
      - ${STACK_DIR:-.}/state/mongo-keyfile:/etc/mongo-keyfile:ro
    command:
      - mongod
      - --replSet
      - ${MONGO_REPLICA_SET:-rs0}
      - --bind_ip_all
      - --keyFile
      - /etc/mongo-keyfile
      # ÖNBELLEK TAVANI BURADA DA OLMALI. Yoksa bu düğüm MongoDB'nin
      # varsayılanıyla açılır: (RAM − 1 GB) / 2. 16 GB'lık bir sunucuda bu
      # 7.5 GB eder — yani panelin bütün bellek muhasebesinin dışında,
      # controller'ın hesapladığı tavanın kat kat üstünde. Replica set'te
      # ana kopya KENDİLİĞİNDEN değişir; o an bu düğüm ana kopya olur ve
      # sunucu, kimsenin istemediği bir belleği ayırmaya başlar.
      - --wiredTigerCacheSizeGB
      - ${MONGO_WIREDTIGER_CACHE_GB:-1}
    healthcheck:
      test: ["CMD-SHELL", "${MONGO_SHELL:-mongosh} --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================================================
  # REDIS   —   profile: redis
  # ===========================================================================
  redis:
    <<: *svc
    profiles: [redis]
    image: ${REDIS_IMAGE:-redis:${REDIS_VERSION:-8-alpine}}
    container_name: redis
    command: >
      redis-server
      --replicaof ${REDIS_STANDBY_OF:-no} ${REDIS_STANDBY_PORT:-one}
      --requirepass ${REDIS_PASSWORD:-${DB_PASSWORD}}
      --masterauth ${REDIS_PASSWORD:-${DB_PASSWORD}}
      --appendonly ${REDIS_APPENDONLY:-yes}
      --protected-mode yes
      --maxmemory ${REDIS_MAXMEMORY:-384mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --tcp-keepalive 60
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDISCLI_AUTH\" --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    environment:
      # redis-cli parolayı bu env'den okur → `ps` çıktısında görünmez.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-${DB_PASSWORD}}
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-600M}

  redis-insight:
    <<: *svc
    profiles: [redis]
    image: redis/redisinsight:2.58
    container_name: redis-insight
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5540/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  redis-exporter:
    <<: *svc
    profiles: [redis]
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    environment:
      # Devirden sonra ana kopya değişir; sabit adres eski düğümde kalırdı.
      REDIS_ADDR: "redis://${REDIS_PRIMARY_HOST:-redis}:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${DB_PASSWORD}}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  # --- Redis replikası (profile: redis-replica) ------------------------------
  redis-replica:
    <<: *svc
    profiles: [redis-replica]
    image: ${REDIS_IMAGE:-redis:${REDIS_VERSION:-8-alpine}}
    container_name: redis-replica
    # KATLANMIŞ SKALER (>) — buradaki her satır KOMUT SATIRI ARGÜMANIDIR.
    # Blok içine "#" ile yorum yazılamaz: YAML onu metnin parçası sayar ve
    # redis-server "#" kelimesini argüman olarak alıp şununla ölür:
    #   *** FATAL CONFIG FILE ERROR *** wrong number of arguments
    # (bir kez yapıldı; e2e yakaladı). Açıklamalar bu yüzden blok DIŞINDA.
    #
    # --protected-mode / --tcp-keepalive ana kopyada da var: bu düğüm
    # devirden sonra ana kopya olacak, ayarların eşit olması gerekiyor.
    command: >
      redis-server
      --replicaof ${REDIS_REPLICA_STANDBY_OF:-redis} ${REDIS_REPLICA_STANDBY_PORT:-6379}
      --requirepass ${REDIS_PASSWORD:-${DB_PASSWORD}}
      --masterauth ${REDIS_PASSWORD:-${DB_PASSWORD}}
      --appendonly ${REDIS_APPENDONLY:-yes}
      --replica-read-only ${REDIS_REPLICA_READ_ONLY:-yes}
      --maxmemory ${REDIS_MAXMEMORY:-384mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --protected-mode yes
      --tcp-keepalive 60
    volumes:
      - redis_replica_data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-${DB_PASSWORD}}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDISCLI_AUTH\" --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${REDIS_REPLICA_MEM_LIMIT:-${REDIS_MEM_LIMIT:-600M}}

  # ===========================================================================
  # MSSQL   —   profile: mssql
  # ===========================================================================
  # Admin kullanıcısı MSSQL'de sabittir: 'sa' (root olamaz). Parola MSSQL
  # politikası gereği güçlü olmalı: 8+ karakter, büyük/küçük/rakam/özel'den 3'ü.
  mssql:
    <<: *svc
    profiles: [mssql]
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}}
    container_name: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-${DB_PASSWORD}}
      # VARSAYILAN EXPRESS. Developer sürümü de ücretsizdir ama YALNIZ
      # geliştirme/test içindir: üretime çıkan bir kurulumda lisans ihlalidir
      # ve bunu kimse container'ı açarken hatırlamaz. Express üretimde de
      # ücretsizdir (veritabanı başına 10 GB, ~1.4 GB tampon havuzu, 4 çekirdek)
      # — bu yığının hedefi olan iç/küçük iş yükleri için fazlasıyla yeterli.
      # Daha fazlası gerekiyorsa .env'de MSSQL_PID=Developer (yalnız test) ya da
      # satın alınmış Standard/Enterprise yazılır.
      MSSQL_PID: ${MSSQL_PID:-Express}
      # SQL Server'ın kendi bellek tavanı — container limitinin altında tutulur,
      # yoksa motor limiti aşıp cgroup OOM-killer'a yakalanır.
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${MSSQL_MEM_LIMIT:-4G}

  # ===========================================================================
  # CASSANDRA   —   profile: cassandra   (eski cassandra/ alt-stack'i buraya taşındı)
  # ===========================================================================
  cassandra:
    <<: *svc
    profiles: [cassandra]
    image: ${CASSANDRA_IMAGE:-cassandra:${CASSANDRA_VERSION:-5.0}}
    container_name: cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-databases-stack}
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_AUTHORIZER: CassandraAuthorizer
      CASSANDRA_NUM_TOKENS: "16"
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEW:-256M}
      MAX_HEAP_SIZE: ${CASSANDRA_HEAP:-1G}
      # Thrift (9160 / start_rpc) Cassandra 4.0'da kaldırıldı — ölü ayar temizlendi.
      #
      # JMX: Cassandra varsayılan olarak JMX'i YALNIZ localhost'ta dinler
      # (LOCAL_JMX=yes). Exporter ayrı bir container olduğu için ona
      # ulaşamıyor ve sonsuza dek "Waiting for Cassandra JMX" der.
      # LOCAL_JMX=no ile ağa açılıyor. Kimlik doğrulaması kapalı ama 7199
      # host'a YAYINLANMIYOR — yalnız compose ağı içinden erişilebilir,
      # bu da diğer servislerle aynı güven sınırı.
      LOCAL_JMX: "no"
      JVM_EXTRA_OPTS: >-
        -Djava.net.preferIPv4Stack=true
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Dcom.sun.management.jmxremote.rmi.port=7199
        -Djava.rmi.server.hostname=cassandra
    volumes:
      - cassandra_data:/var/lib/cassandra
    ulimits:
      memlock: -1
      nproc: 32768
      nofile: { soft: 100000, hard: 100000 }
    healthcheck:
      test: ["CMD-SHELL", "nodetool status 2>/dev/null | grep -q '^UN' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: ${CASSANDRA_MEM_LIMIT:-2G}

  cassandra-exporter:
    <<: *svc
    profiles: [cassandra]
    image: criteord/cassandra_exporter:latest
    container_name: cassandra-exporter
    environment:
      CASSANDRA_EXPORTER_CONFIG_host: "cassandra:7199"
      CASSANDRA_EXPORTER_CONFIG_listenPort: "9500"
    depends_on:
      cassandra:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================================================
  # ELASTICSEARCH + KIBANA   —   profile: elasticsearch
  # ===========================================================================
  elasticsearch:
    <<: *svc
    profiles: [elasticsearch]
    image: ${ELASTIC_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}}
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-${DB_PASSWORD}}
      xpack.security.enabled: "true"
      # HTTP TLS kapalı: dış dünyaya zaten gateway'in TLS'i üzerinden çıkıyor,
      # 9200 yalnız iç ağda. Basic auth AÇIK kalıyor.
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: ${ELASTIC_JAVA_OPTS:--Xms1g -Xmx1g}
      bootstrap.memory_lock: "true"
      # Snapshot deposu — scripts/backup.sh bunun içine snapshot alıp tar'lar.
      path.repo: /snapshots
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_snapshots:/snapshots
    depends_on:
      # Snapshot deposunun SAHİPLENMESİ önce bitmeli. Ölçüldü: docker adlandırılmış
      # hacmi root'a ait yaratıyor, ES uid 1000 ile koşuyor ve depoyu kuramıyor —
      # "path is not accessible on master node". Temiz kurulumda Elasticsearch'ün
      # yedeği hiç alınamıyordu.
      elasticsearch-repo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${ELASTIC_MEM_LIMIT:-2G}

  # Tek seferlik: snapshot deposunu Elasticsearch'ün yazabileceği hâle getirir.
  # ES imajı uid 1000 ile koşuyor; docker'ın yarattığı adlandırılmış hacim ise
  # root'a ait. Bu servis olmadan snapshot API'si depoyu KURAMIYOR ve yedekleme
  # sessizce "snapshot başarısız" diyordu.
  elasticsearch-repo-init:
    profiles: [elasticsearch]
    image: ${ELASTIC_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}}
    container_name: elasticsearch-repo-init
    restart: "no"
    user: "0:0"
    networks: [dbnet]
    logging: *logging
    entrypoint: ["sh", "-c", "chown -R 1000:0 /snapshots && chmod 775 /snapshots && echo '[es-repo-init] /snapshots hazır'"]
    volumes:
      - elasticsearch_snapshots:/snapshots

  # Tek seferlik: Kibana'nın kullandığı kibana_system kullanıcısının parolasını
  # ayarlar. Kibana `elastic` superuser'ı ile bağlanmayı REDDEDER, bu yüzden şart.
  elasticsearch-init:
    profiles: [elasticsearch]
    image: ${ELASTIC_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}}
    container_name: elasticsearch-init
    restart: "no"
    networks: [dbnet]
    logging: *logging
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-${DB_PASSWORD}}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-${ELASTIC_PASSWORD:-${DB_PASSWORD}}}
    entrypoint:
      - bash
      - -c
      - |
        until curl -sf -u "elastic:$$ELASTIC_PASSWORD" http://elasticsearch:9200/_cluster/health >/dev/null; do
          echo "[es-init] elasticsearch bekleniyor..."; sleep 5
        done
        curl -sf -u "elastic:$$ELASTIC_PASSWORD" -X POST \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -H 'Content-Type: application/json' \
          -d "{\"password\":\"$$KIBANA_SYSTEM_PASSWORD\"}" >/dev/null \
          && echo "[es-init] kibana_system parolası ayarlandı" \
          || { echo "[es-init] BAŞARISIZ"; exit 1; }
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    <<: *svc
    profiles: [elasticsearch]
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.15.3}
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-${ELASTIC_PASSWORD:-${DB_PASSWORD}}}
      SERVER_PUBLICBASEURL: https://${STACK_HOST:-localhost}:8086
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?KIBANA_ENCRYPTION_KEY gerekli — ./install.sh üretir}
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${KIBANA_MEM_LIMIT:-1G}

  elasticsearch-exporter:
    <<: *svc
    profiles: [elasticsearch]
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: elasticsearch-exporter
    command:
      - "--es.uri=http://elastic:${ELASTIC_PASSWORD:-${DB_PASSWORD}}@elasticsearch:9200"
      - "--es.all"
      - "--es.indices"
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  # ===========================================================================
  # KAFKA (KRaft — Zookeeper yok)   —   profile: kafka
  # ===========================================================================
  kafka:
    <<: *svc
    profiles: [kafka]
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.9.0}}
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://${STACK_HOST:-localhost}:${KAFKA_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${KAFKA_MEM_LIMIT:-1536M}

  kafka-ui:
    <<: *svc
    profiles: [kafka]
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: databases-stack
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      SERVER_PORT: 8080
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  kafka-exporter:
    <<: *svc
    profiles: [kafka]
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:9092", "--web.listen-address=:9308"]
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  # ===========================================================================
  # RABBITMQ   —   profile: rabbitmq
  # ===========================================================================
  rabbitmq:
    <<: *svc
    profiles: [rabbitmq]
    image: ${RABBITMQ_IMAGE:-rabbitmq:${RABBITMQ_VERSION:-3.13-management-alpine}}
    container_name: rabbitmq
    # DÜĞÜM ADI SABİT OLMALI — yoksa her yeniden yaratmada BÜTÜN TANIMLAR
    # KAYBOLUR. RabbitMQ durumunu mnesia/rabbit@<hostname> altında tutar ve
    # docker, hostname'i varsayılan olarak CONTAINER ID yapar. container_name
    # bunu değiştirmez. Sonuç: her recreate'te yepyeni ve BOŞ bir düğüm açılır,
    # eski vhost'lar/kullanıcılar/kuyruklar volume içinde öksüz kalır.
    # Ölçüldü — tek bir volume'un içinde birikmiş düğümler:
    #   rabbit@2265314e3f4e  rabbit@50271ae2babb  rabbit@644c923a8774 …
    # e2e lifecycle paketi bunu şöyle yakaladı: kapat/aç sonrası yazılan
    # vhost "<boş>" döndü. Volume duruyordu; veri gitmişti. "Hacim var, veri
    # güvende" cümlesinin neden yetmediğinin ders kitabı örneği.
    #
    # NOT (mevcut kurulumlar): bu satırdan sonra düğüm adı rabbit@rabbitmq
    # olur ve eski rabbit@<id> dizinlerindeki tanımlar OKUNMAZ — ama zaten
    # her recreate'te okunmuyordu. Öksüz dizinler yer kaplar; silmeden önce
    # içlerinde işinize yarayan bir şey olup olmadığına bakın:
    #   docker run --rm -v databases-stack_rabbitmq_data:/d alpine ls /d/mnesia
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-${DB_PASSWORD}}
      # Prometheus eklentisi management imajında yerleşik (:15692/metrics)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit disk_free_limit 2147483648"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # ping DEĞİL. `rabbitmq-diagnostics ping` yalnız Erlang düğümünün cevap
      # verdiğini gösterir; 'rabbit' UYGULAMASI hâlâ başlıyor olabilir. O
      # aralıkta panel "sağlıklı" der, ama broker hiçbir işi kabul etmez —
      # ölçüldü: healthcheck yeşilken `rabbitmqctl add_vhost` "this command
      # requires the 'rabbit' app to be running on the target node" ile
      # düştü (çıkış 64). Sağlık rozetinin anlamı "uygulamanız bağlanabilir"
      # olmalı; check_running uygulamanın çalıştığını, check_port_connectivity
      # ise dinleyicinin gerçekten bağlantı kabul ettiğini ölçer.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${RABBITMQ_MEM_LIMIT:-1G}

  # ===========================================================================
  # CLICKHOUSE   —   profile: clickhouse
  # ===========================================================================
  clickhouse:
    <<: *svc
    profiles: [clickhouse]
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}}
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-${DB_PASSWORD}}
      CLICKHOUSE_DB: ${DEFAULT_DATABASE:-defaultdb}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # config.d/prometheus.xml bunu `from_env` ile okur (bkz. o dosya).
      CLICKHOUSE_MAX_MEMORY: ${CLICKHOUSE_MAX_MEMORY:-1610612736}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ${STACK_DIR:-.}/config/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ${STACK_DIR:-.}/config/clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEM_LIMIT:-2G}

  # ===========================================================================
  # NEO4J   —   profile: neo4j
  # ===========================================================================
  neo4j:
    <<: *svc
    profiles: [neo4j]
    image: ${NEO4J_IMAGE:-neo4j:${NEO4J_VERSION:-5-community}}
    container_name: neo4j
    environment:
      # Neo4j parolası en az 8 karakter olmalı.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-${DB_PASSWORD}}"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
      NEO4J_server_default__listen__address: "0.0.0.0"
      # Browser'ın JS'i tarayıcıdan doğrudan bolt'a bağlanır → host adresi şart.
      NEO4J_server_bolt_advertised__address: "${STACK_HOST:-localhost}:${NEO4J_BOLT_PORT:-7687}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${NEO4J_MEM_LIMIT:-1536M}

  # ===========================================================================
  # MINIO (S3 uyumlu nesne depolama)   —   profile: minio
  # ===========================================================================
  minio:
    <<: *svc
    profiles: [minio]
    image: ${MINIO_IMAGE:-minio/minio:${MINIO_VERSION:-RELEASE.2024-10-13T13-34-11Z}}
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${DB_PASSWORD}}
      MINIO_BROWSER_REDIRECT_URL: https://${STACK_HOST:-localhost}:8089
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEM_LIMIT:-512M}

  # ===========================================================================
  # İZLEME (profile: monitoring)
  # ===========================================================================
  # Motorların exporter'ları her zaman vardı ama onları OKUYAN bir yüz yoktu;
  # kullanıcı kendi Prometheus'unu kurup scrape config yazmak zorundaydı — yani
  # tam da "kullanıcıdan bilemeyeceği şeyi istemek". Bu profil o boşluğu
  # kapatır: açtığınızda grafikler hazır gelir, kapattığınızda sıfır RAM.
  # ---------------------------------------------------------------------------

  prometheus:
    <<: *svc
    profiles: [monitoring]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    container_name: prometheus
    user: "nobody"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Saklama süresi VE boyutu birlikte sınırlanır. Yalnız süre sınırlansaydı
      # yoğun bir kurulumda disk sessizce dolar ve veritabanları yazmayı
      # bırakırdı — izleme aracının üretimi düşürmesi kabul edilemez.
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}"
      - "--web.enable-lifecycle"
    volumes:
      - ${STACK_DIR}/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${STACK_DIR}/config/prometheus/rules:/etc/prometheus/rules:ro
      # Hedef listesini controller üretir. Prometheus dosyayı file_sd ile
      # izler; motor açılıp kapandıkça yeniden başlatma GEREKMEZ.
      - ${STACK_DIR}/state/prometheus:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-512M}

  grafana:
    <<: *svc
    profiles: [monitoring]
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:11.3.1}
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-${DB_PASSWORD}}
      # Panel zaten gateway'in basic-auth'u arkasında. İkinci bir giriş ekranı
      # koymak, kullanıcıya hatırlaması gereken ikinci bir parola vermek
      # demekti; anonim ziyaretçi "Viewer" olarak girer, düzenlemek isteyen
      # admin ile giriş yapar (parola credentials.txt içinde).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      # İç ağ kurulumu: dışarı hiçbir istek gitmesin.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_LEVEL: warn
    volumes:
      - ${STACK_DIR}/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${STACK_DIR}/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-256M}

  # NOT — burada eskiden cAdvisor vardı ve KALDIRILDI.
  # Container başına bellek/CPU'yu cAdvisor'dan almak doğal görünüyordu ama
  # bu sunucuda (Docker 29, containerd snapshotter, "overlayfs") cAdvisor'ın
  # docker entegrasyonu /var/lib/docker/image/overlay2/layerdb düzenini arıyor;
  # o düzen artık yok. Sonuç sinsiydi: hedef "up" görünüyor, scrape başarılı,
  # ama container başına HİÇ seri üretilmiyordu — Genel Bakış panosunun on
  # sorgusu da sessizce boş dönüyordu. Grafikler görünür, içleri boş.
  #
  # Yerine controller kendi /metrics ucunu yayınlıyor. Daha sağlam (her Docker
  # sürümünde çalışır), daha hafif (~190 MB az), privileged container ve
  # /var/lib/docker bağlaması gerektirmiyor; en önemlisi sayılar belleği
  # DAĞITAN kodun kendi defterinden geliyor — "otomatik hesap tuttu mu?"
  # sorusu, hesabı yapanın rakamlarıyla cevaplanıyor.

  # Sunucunun kendi RAM/disk/CPU durumu. "Disk doluyor" uyarısı buradan gelir;
  # veritabanları için disk dolması en sert arıza biçimidir.
  node-exporter:
    <<: *svc
    profiles: [monitoring]
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.8.2}
    container_name: node-exporter
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.disable-defaults"
      - "--collector.filesystem"
      - "--collector.meminfo"
      - "--collector.cpu"
      - "--collector.loadavg"
      - "--collector.diskstats"
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          memory: ${NODE_EXPORTER_MEM_LIMIT:-64M}
