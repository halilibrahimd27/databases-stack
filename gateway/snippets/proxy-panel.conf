# Web panelleri için proxy ayarları.
#
# Gateway'in Basic auth başlığı arkadaki panele İLETİLMEZ. Aksi halde panel
# onu KENDİ kimlik bilgisi sanıyor ve kendi arka ucuna denemeye çalışıyor:
#   • Kibana → admin:<panel parolası> ile Elasticsearch'e bağlanmayı dener → 401
#   • RabbitMQ Management → aynı bilgiyle RabbitMQ kullanıcısı arar → 401
# Kimlik doğrulama gateway'de sonlanır; panel kendi girişini ister
# (bağlantı bilgilerini dashboard'daki "Bağlantı bilgisi" düğmesi verir).
include /etc/nginx/snippets/proxy.conf;
proxy_set_header Authorization "";
