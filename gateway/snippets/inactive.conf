# Pasif motor için gösterilen sayfa. `internal` → dışarıdan doğrudan istenemez.
location = /_inactive.html {
    internal;
    auth_basic off;
    root /usr/share/nginx/html;
    try_files /inactive.html =503;
}

# Zaman aşımı sayfası (proxy.conf'taki `error_page 504`). "Pasif" sayfasından
# AYRI olmak zorunda: 504, motorun kapalı olduğu değil ÇALIŞAN motorun cevabı
# geciktiği anlamına gelir. İkisi tek sayfaya bağlıyken uzun süren bir import
# kullanıcıya "veritabanı kapalı" diye görünüyor, o da işlemi baştan
# başlatıyordu — sunucuda hâlâ süren ilk işlemin üzerine.
#
# Sayfa neden burada, gateway/html altında değil: 504 gövdesi tek satırlık bir
# uyarıdan ibaret; ayrı dosya olsaydı hata anında ONUN da okunabilmesi gerekirdi.
# `internal` olduğu için dışarıdan istenemez, auth_basic da kapalı — yoksa hata
# sayfası kullanıcıdan ikinci kez parola isterdi.
#
# METİNDE "SAYFAYI YENİLEYİN" YAZMIYOR — bilerek. Bu sayfanın görüldüğü tek
# gerçekçi durum phpMyAdmin/Adminer'de bir POST ile başlatılmış import ya da
# ALTER'dır. Bir POST cevabında "yenile" demek, tarayıcıda "Formu yeniden
# gönder" onayını çıkarmak demektir; veritabanı bilmeyen kullanıcı ona basınca
# aynı dump ikinci kez, yarım uygulanmış verinin üzerine yazılır — yani sayfanın
# kalın harflerle uyardığı arızanın tam kendisi. Onun yerine tek güvenli eylem
# gösteriliyor: panelin ana sayfasını GET ile yeniden açan bir düğme (href='/'
# görece adres olduğu için panelin kendi portunda kalır).
location = /_timeout.html {
    internal;
    auth_basic off;
    default_type text/html;
    charset      utf-8;
    return 504 "<!doctype html>
<html lang='tr'>
<meta charset='utf-8'>
<title>İşlem uzun sürdü</title>
<body style='font-family:system-ui,Segoe UI,Roboto,sans-serif;max-width:640px;margin:64px auto;padding:0 24px;line-height:1.65;color:rgb(32,38,48)'>
<h1 style='font-size:22px;margin:0 0 16px'>İşlem uzun sürdü</h1>
<p><b>Veritabanınız kapalı değil, çalışıyor.</b> Sadece bu işlem beklenen süre
içinde bitmedi. Büyük bir yedek dosyası yüklerken ya da büyük bir tabloyu
değiştirirken olur.</p>
<p style='background:rgb(255,244,214);border-left:4px solid rgb(224,168,0);padding:12px 16px'>
<b>Aynı işlemi tekrar başlatmayın.</b> İşlem sunucuda büyük olasılıkla hâlâ
sürüyor; ikinci kez başlatırsanız aynı veriler iki kez yazılabilir.<br>
<b>Bu sayfayı da yenilemeyin.</b> Yenilemek, az önce gönderdiğiniz formu
tarayıcıya ikinci kez gönderttirir — yani işlemi baştan başlatır.</p>
<p>Yapmanız gereken: birkaç dakika bekleyin, sonra aşağıdaki düğmeyle panelin
ana sayfasını yeniden açın ve verilerin gelip gelmediğine oradan bakın.</p>
<p><a href='/' style='display:inline-block;margin-top:4px;padding:10px 18px;border-radius:10px;background:rgb(36,86,214);color:rgb(255,255,255);text-decoration:none;font-weight:600'>Panelin ana sayfasını aç</a></p>
<p style='color:rgb(110,118,130);font-size:13px'>Bu düğme yeni bir sayfa açar,
işlemi tekrar göndermez.</p>
<p style='color:rgb(110,118,130);font-size:13px'>Veritabanı gerçekten kapalı
olsaydı bu sayfa yerine size Aktif Et düğmesini gösteren sayfa gelirdi.</p>
</body>
</html>
";
}
