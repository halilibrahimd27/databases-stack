# =============================================================================
# CSRF kapısının hata sayfası — her panel SERVER bloğuna include edilir
# =============================================================================
# Kapının kendisi snippets/panel-csrf.conf'ta (location içine include edilir);
# hata sayfası location seviyesinde tanımlanamayacağı için ayrı dosyada.
#
# `internal` → dışarıdan doğrudan istenemez. auth_basic kapalı, yoksa hata
# sayfası kullanıcıdan ikinci kez parola isterdi.
#
# METİN NEDEN "BİR ŞEYİ DEĞİŞTİREN İSTEK" DEMİYOR: kapı artık yönteme değil
# isteği kimin başlattığına bakıyor, yani okuma görünümlü (GET) istekleri de
# durduruyor — çünkü eski panellerde silen/temizleyen uçlar GET'tir. Eski metin
# "bir şeyi değiştiren bu istek" diyordu; kapının kapsamı genişleyince o cümle
# kullanıcıya yanlış bilgi verir hâle gelirdi.
location = /_panel_crosssite.html {
    internal;
    auth_basic off;
    default_type text/html;
    charset      utf-8;
    return 403 "<!doctype html>
<html lang='tr'>
<meta charset='utf-8'>
<title>Bu istek durduruldu</title>
<body style='font-family:system-ui,Segoe UI,Roboto,sans-serif;max-width:640px;margin:64px auto;padding:0 24px;line-height:1.65;color:rgb(32,38,48)'>
<h1 style='font-size:22px;margin:0 0 16px'>Bu istek durduruldu</h1>
<p>Bu istek panelin kendi sayfasından gelmediği için güvenlik gereği
durduruldu. <b>Veritabanınızda hiçbir şey değişmedi.</b></p>
<p>Paneli kullanmak istiyorsanız yönetim panosundaki düğmeyle açın ya da
adresini tarayıcınızın adres çubuğuna kendiniz yazın; işlemi oradan yapın.</p>
<p><a href='/' style='display:inline-block;margin-top:4px;padding:10px 18px;border-radius:10px;background:rgb(36,86,214);color:rgb(255,255,255);text-decoration:none;font-weight:600'>Panelin ana sayfasını aç</a></p>
<p style='color:rgb(110,118,130);font-size:13px'>Bunu başka bir sitedeki
bağlantıya tıkladıktan sonra gördüyseniz, o sayfa sizin adınıza veritabanınıza
komut göndermeye çalışmış olabilir.</p>
</body>
</html>
";
}
