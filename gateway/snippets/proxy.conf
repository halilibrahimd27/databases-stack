# Tüm panel proxy'lerinin ortak başlıkları. Paneller kendi mutlak URL'lerini
# bu başlıklardan kurar (pgAdmin X-Forwarded-*, phpMyAdmin PMA_ABSOLUTE_URI).
proxy_http_version 1.1;
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  https;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Forwarded-Port   $server_port;
# WebSocket (RedisInsight, Kibana, Kafka UI, Neo4j Browser bunu kullanır)
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $connection_upgrade;
# NOT: proxy_read_timeout / proxy_send_timeout burada TANIMLI DEĞİL — bilerek.
# Bu snippet location içine include ediliyor; uzun süren uçlar (Kibana, /api)
# kendi değerini vermek istediğinde aynı blokta iki tanım oluşur ve nginx
# "duplicate directive" ile hiç açılmaz. Varsayılan http seviyesinde,
# istisnalar location seviyesinde (miras, çakışma değil).
proxy_buffering     off;
# Motor kapalıyken container yoktur → DNS çözülmez / bağlantı reddedilir → 502.
# Bunu kullanıcıya "bu servis pasif" sayfası olarak gösteriyoruz (bkz.
# inactive.html). 503 de burada: nginx'in kendi ürettiği "hiç hedef yok" hali.
error_page 502 503 =503 /_inactive.html;
# 504 BİLEREK AYRI. 504 "motor kapalı" demek değil, "cevap zamanında gelmedi"
# demektir ve ikisi aynı sayfaya bağlıyken kullanıcıyı yanlış yönlendiriyordu:
# phpMyAdmin'den 400 MB'lık bir dump import edilirken nginx 300. saniyede okuma
# zaman aşımına düştü, kullanıcı "bu veritabanı şu an kapalı" sayfasını görüp
# import'u baştan başlattı — oysa motor çalışıyor ve ilk import sunucuda hâlâ
# sürüyordu; aynı dump yarım uygulanmış verinin üzerine ikinci kez yazıldı.
# Artık ne olduğunu söyleyen ayrı bir sayfa gösteriyoruz (bkz. inactive.conf).
error_page 504 /_timeout.html;
