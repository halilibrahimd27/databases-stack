# Tüm panel proxy'lerinin ortak başlıkları. Paneller kendi mutlak URL'lerini
# bu başlıklardan kurar (pgAdmin X-Forwarded-*, phpMyAdmin PMA_ABSOLUTE_URI).
proxy_http_version 1.1;
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  https;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Forwarded-Port   $server_port;
# WebSocket (RedisInsight, Kibana, Kafka UI, Neo4j Browser bunu kullanır)
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $connection_upgrade;
# NOT: proxy_read_timeout / proxy_send_timeout burada TANIMLI DEĞİL — bilerek.
# Bu snippet location içine include ediliyor; uzun süren uçlar (Kibana, /api)
# kendi değerini vermek istediğinde aynı blokta iki tanım oluşur ve nginx
# "duplicate directive" ile hiç açılmaz. Varsayılan http seviyesinde,
# istisnalar location seviyesinde (miras, çakışma değil).
proxy_buffering     off;
# Motor kapalıyken container yoktur → DNS çözülmez → 502. Bunu kullanıcıya
# "bu servis pasif" sayfası olarak gösteriyoruz (bkz. inactive.html).
error_page 502 503 504 =503 /_inactive.html;
