# =============================================================================
# Panel tek-oturum çerezi — YALNIZCA 443'teki dashboard location'ına include
# =============================================================================
# Sorun: paneller ayrı portlarda (8081-8092) ve tarayıcı için her port AYRI BİR
# ORIGIN'dir. Basic auth origin başına saklandığı için, panele 443'te girmiş
# olmanız 8081'i kapsamaz — kullanıcı her panelde yeniden kullanıcı adı/parola
# soruluyordu ve parolayı hatırlamayan .env dosyasını açmak zorunda kalıyordu.
#
# Çözüm: çerezler port değil HOST başına paylaşılır. Buraya YALNIZCA basic auth
# geçildikten sonra gelinebildiği için, çerezi burada bırakmak "bu tarayıcı
# panel parolasını biliyor" demektir. Panel portları çerezi görünce parola
# sormaz (bkz. $panel_auth map'i, stack.conf.template).
#
# Dışarıdan doğrudan panele gelen biri çerezi taşımadığı için hâlâ parola
# ekranıyla karşılaşır; sahte çerez de eşleşmez.
#
# HttpOnly : sayfadaki JavaScript okuyamaz (XSS ile çalınamaz)
# Secure   : yalnız HTTPS üzerinden gönderilir
# SameSite=Lax : başka bir siteden yapılan POST'larla birlikte GİTMEZ
#            (/api/ zaten ayrıca çapraz-site kontrolünden geçiyor)
# Path=/   : aynı host'un tüm portlarında geçerli — asıl istediğimiz bu
#
# Oturum çerezi: tarayıcı kapanınca silinir (Expires/Max-Age YOK). Ortak
# kullanılan bir makinede panelin açık kalmaması için bilinçli tercih.
# $panel_sso_secret stack.conf.template içinde tanımlı (snippet'ler
# envsubst'tan geçmediği için sır oradan bir değişkene bağlanıyor).
add_header Set-Cookie "dbstack_sso=$panel_sso_secret; Path=/; Secure; HttpOnly; SameSite=Lax" always;

# DİKKAT — aşağıdaki üç başlık burada TEKRAR yazılmak zorunda.
# nginx'te add_header mirası "hep ya da hiç"tir: bir location kendi add_header
# direktifini tanımlarsa, üst seviyedeki (http) TÜM add_header'ları kaybeder.
# Yalnız Set-Cookie eklenseydi dashboard sayfası X-Frame-Options,
# X-Content-Type-Options ve Referrer-Policy başlıklarını sessizce yitirirdi —
# yani clickjacking koruması, tam da giriş yapılan sayfada kapanırdı.
add_header X-Frame-Options        "SAMEORIGIN"  always;
add_header X-Content-Type-Options "nosniff"     always;
add_header Referrer-Policy        "same-origin" always;
