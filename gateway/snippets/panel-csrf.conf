# =============================================================================
# Panel CSRF kapısı — HER panel location'ının İÇİNE include edilir
# =============================================================================
# Ne yapar: arkadaki panele yalnızca (a) panelin KENDİ sayfasının başlattığı
# istekleri ve (b) dashboard'dan/adres çubuğundan gelen giriş gezinmesini
# geçirir. Başka bir sayfanın başlattığı her istek — yöntemi ve yolu ne olursa
# olsun — burada durur. Ölçütün ayrıntısı ve neden HTTP yönteminin tek başına
# yetmediği şablonun başındaki $panel_from map'inde anlatılıyor
# (templates/stack.conf.template).
#
# KISACA NEDEN: kapı eskiden yalnız yönteme bakıyordu ve "GET okumadır"
# varsayıyordu. Eski web arayüzlerinde bu varsayım yanlış: mongo-express
# 1.0.2'de indeks silme, sıkıştırma ve yeniden indeksleme uçları GET'tir. Kötü
# niyetli bir sayfadaki tek bir <img src="https://<ip>:8083/db/app/dropIndex/
# users?name=email_1"> etiketi kapıdan geçiyor, tarayıcı da o panele girmiş
# yöneticinin kimlik bilgisini isteğe kendisi ekliyordu.
#
# NEDEN YOL KARA LİSTESİ DEĞİL: bu bir mongo-express arızası değil, bir sınıf.
# Panel imajı yükselince yollar değişir, başka panelde başka bir GET ucu çıkar
# (ClickHouse'un /?query=... ucu aynı aileden) ve liste sessizce eksik kalır —
# test yeşil kalır, koruma kalmaz. Gateway arkadaki panelin hangi ucunun ne
# yaptığını zaten bilemez; "bu istek veriyi değiştirir mi?" burada
# cevaplanabilir bir soru değildir. Cevaplanabilen soru "bu isteği panelin
# kendi sayfası mı başlattı?"dır ve cevabı tarayıcı veriyor.
#
# NEDEN HER PANELDE: kapı yola değil isteği kimin başlattığına baktığı için
# panelden panele taşınabiliyor ve meşru kullanıma hiçbir bedeli yok — panel
# sayfasının kendi istekleri (bağlantılar, formlar, XHR, resimler, WebSocket)
# tanım gereği same-origin'dir, hepsi geçer.

# Engellenen istek nginx'in çıplak "403 Forbidden" sayfasını göstermesin:
# veritabanı bilmeyen kullanıcı ne olduğunu anlamaz, panelin bozulduğunu sanır.
# Sayfa snippets/panel-csrf-page.conf'ta; bu satır proxy include'undan ÖNCE
# gelmeli, nginx aynı kod için İLK error_page tanımını kullanıyor.
error_page 403 /_panel_crosssite.html;

# 1) İsteği panelin kendi sayfası başlatmadıysa arkaya hiç gitmesin. Yöntem
#    burada BİLEREK sorulmuyor: GET ile silen uçlar da bu kapıdan dönüyor.
#    Kötü niyetli sayfanın <img>/<iframe>/fetch isteği de, location.href ile
#    yaptığı çapraz-site gezinme de buraya düşer (SameSite=Lax çerez üst
#    seviye gezinmede gönderildiği için ikincisi de gerçek bir saldırı yolu).
if ($panel_from = 0) { return 403; }

# 2) Giriş gezinmesi (dashboard :443 → panel :8083 geçişi; tarayıcı buna
#    "same-site" der) YALNIZCA okuma olabilir. Aynı host'un başka bir
#    portundaki bir sayfanın gizli form POST'u buradan geçmesin diye.
#    nginx'te "if" içinde VE yok, o yüzden iki koşulu tek dizgede
#    birleştiriyoruz: "11" = veri değiştiren yöntem + yalnız-giriş kademesi.
set $panel_deny "$panel_write$panel_from";
if ($panel_deny = "11") { return 403; }

# 3) Sec-Fetch-* göndermeyen tarayıcılar (Safari 16.4 öncesi) için ikinci kapı:
#    istek başka bir adresten geliyorsa Origin onu ele verir. Origin yokken
#    $csrf_origin_host $host'a eşitlenir (bkz. map), yani normal gezinme ve
#    curl ile çalışan bakım betikleri etkilenmez. Bu kapı POST'u yakalar,
#    <img> ile gönderilen GET'i yakalamaz — o tarayıcılarda kalan tek boşluk
#    budur ve şablonun başında açıkça yazılıdır.
if ($csrf_origin_host != "$host") { return 403; }
