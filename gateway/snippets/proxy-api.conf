# Kontrol API'si (/api/) için proxy ayarları.
#
# Panellerden tek farkı HATA SAYFALARI. Dashboard bu ucu fetch() ile çağırıp
# hata gövdesini kullanıcıya olduğu gibi gösteriyor (app.js: r.text()). Ortak
# error_page'ler HTML döndürdüğü için, controller yeniden başlarken düğmeye
# basan kullanıcı hata penceresinde koca bir HTML kaynağı görüyordu; üstelik
# gelen sayfa "bu veritabanı kapalı" diyordu — oysa kapalı olan motor değil,
# kontrol servisiydi. Burada düz metin, tek cümlelik uçlara yönlendiriyoruz
# (stack.conf.template içindeki /_api_*.txt location'ları).
#
# SIRA ÖNEMLİ: nginx aynı durum kodu için birden çok error_page tanımında
# İLK eşleşeni kullanır. Bu yüzden bunlar proxy.conf include'undan ÖNCE
# gelmek zorunda; altına alınırsa sessizce ortak HTML sayfaları devreye girer.
#
# Durum kodunu error_page belirler, location içindeki `return` DEĞİL: `=503`
# yazılmazsa istemciye upstream hatasının kendi kodu (502) gider. 502/503 için
# 503'te sabitliyoruz ("şu an hizmet veremiyor"), 504'ü ise olduğu gibi
# bırakıyoruz — "zaman aşımı" ile "servis yok" istemci tarafında ayırt
# edilebilsin diye.
error_page 403         /_api_crosssite.txt;   # çapraz-site istek (bkz. $csrf_* map'leri)
error_page 502 503 =503 /_api_down.txt;       # controller yok / yeniden başlıyor
error_page 504         /_api_timeout.txt;     # controller cevabı geciktirdi

include /etc/nginx/snippets/proxy.conf;
