# Metrik uçları için proxy ayarları.
#
# NEDEN AYRI BİR SNIPPET:
# nginx'te proxy_set_header üst seviyeden miras alınır AMA yalnızca alt
# seviyede HİÇ proxy_set_header yoksa. Her location proxy.conf'u include
# ettiği için, server seviyesine yazılan bir başlık ayarı sessizce yok
# sayılırdı. Bu yüzden ortak ayarları buraya include edip ek başlığı da
# aynı bağlamda tanımlıyoruz.
include /etc/nginx/snippets/proxy.conf;

# Basic auth BURADA sonlanır, arkadaki servise iletilmez. MinIO gelen
# Authorization başlığını AWS imzası sanıp reddediyordu:
#   InvalidRequest: The authorization mechanism you have provided is not
#   supported. Please use AWS4-HMAC-SHA256
proxy_set_header Authorization "";
