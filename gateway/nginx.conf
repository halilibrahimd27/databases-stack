# =============================================================================
# databases-stack gateway — ana nginx yapılandırması
# =============================================================================
# Resmi imajın kendi nginx.conf'unun yerine geçer. Tek fark: `stream` bloğu.
#
# NEDEN STREAM (TCP proxy) GEREKLİ:
# Otomatik failover'ın işe yaraması için uygulamanın YENİ primary'yi bulması
# gerekir. Uygulama doğrudan `mariadb:3306` container'ına bağlanıyorsa, primary
# öldüğünde bağlantı adresini elle değiştirmek zorunda kalır — yani failover
# otomatik olmaz. Bu yüzden tüm veritabanı portları gateway üzerinden geçer:
#
#     uygulama → gateway:3306 → (o an primary olan neyse) mariadb:3306
#
# Failover'da controller yalnız stream.d/routes.conf dosyasını yeniden yazıp
# `nginx -s reload` der. Uygulamanın bağlantı adresi HİÇ DEĞİŞMEZ.
#
# `nginx -s reload` mevcut bağlantıları koparmaz; eski worker'lar boşalana
# kadar çalışmaya devam eder.
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

# --- HTTP: dashboard, paneller, metrikler -----------------------------------
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # envsubst'ten geçen asıl yapılandırma buraya düşer
    # (gateway/templates/stack.conf.template → /etc/nginx/conf.d/stack.conf)
    include /etc/nginx/conf.d/*.conf;
}

# --- STREAM: veritabanı portları --------------------------------------------
stream {
    log_format db '$remote_addr [$time_local] $protocol $status '
                  '$bytes_sent/$bytes_received $session_time "$upstream_addr"';
    access_log /var/log/nginx/stream.log db;
    error_log  /var/log/nginx/stream-error.log warn;

    # Kapalı bir motorun container'ı yoktur. resolver + map ile hedef İSTEK
    # anında çözülür; sabit yazılsaydı nginx "host not found in upstream" ile
    # hiç açılmaz ve TÜM veritabanları erişilemez olurdu.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_connect_timeout 5s;
    proxy_timeout         1h;   # uzun süren sorgular ve idle bağlantılar için

    # Hedefler ve dinlenen portlar burada. Bu dosyayı controller üretir ve
    # failover sırasında yeniden yazar (state/routes.conf).
    include /etc/nginx/stream.d/*.conf;
}
