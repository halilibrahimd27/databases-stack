---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog
  namespace: databases-stack
data:
  catalog.json: |
    {
      "version": 2,
      "_comment": [
        "MOTOR KATALOĞU — TEK YETKİ KAYNAĞI.",
        "Bu dosyayı okuyanlar: gateway/html/app.js (dashboard kartları),",
        "controller/app.py (aktivasyon izin listesi), backup.sh (hangi motor yedeklenir),",
        "scripts/gen-k8s.py (K8s manifestleri), scripts/check-catalog.sh (tutarlılık testi).",
        "Yeni bir motor eklemek = buraya bir kayıt + docker-compose.yml'e aynı profile'lı",
        "servisler. check-catalog.sh ikisinin ayrışmadığını doğrular."
      ],
      "categories": {
        "relational": "İlişkisel",
        "document": "Doküman",
        "keyvalue": "Key-Value",
        "widecolumn": "Wide-Column",
        "search": "Arama & Log",
        "streaming": "Mesajlaşma & Streaming",
        "analytics": "Analitik (OLAP)",
        "graph": "Graph",
        "object": "Nesne Depolama",
        "tools": "Araçlar"
      },
      "engines": [
        {
          "id": "mariadb",
          "name": "MariaDB",
          "icon": "🐬",
          "category": "relational",
          "summary": "MySQL uyumlu ilişkisel veritabanı. Genel amaçlı OLTP.",
          "profile": "mariadb",
          "primary_service": "mariadb",
          "services": [
            "mariadb",
            "phpmyadmin",
            "mariadb-exporter"
          ],
          "client_ports": [
            {
              "port": 3306,
              "proto": "tcp",
              "label": "MySQL protokolü"
            }
          ],
          "panel": {
            "name": "phpMyAdmin",
            "port": 8081,
            "services": [
              "phpmyadmin"
            ]
          },
          "exporter": {
            "service": "mariadb-exporter",
            "metrics_path": "/metrics/mariadb",
            "port": 9104,
            "scrape_path": "/metrics"
          },
          "replication": {
            "mode": "primary-replica",
            "profile": "mariadb-replica",
            "replica_service": "mariadb-replica",
            "replica_port": 3307,
            "note": "GTID tabanlı asenkron replikasyon. Replika read-only açılır."
          },
          "backup": {
            "supported": true,
            "kind": "logical",
            "ext": "sql.gz"
          },
          "connection": {
            "username": "root",
            "database": "defaultdb",
            "password_env": "MARIADB_PASSWORD"
          },
          "k8s": {
            "image_env": "MARIADB_VERSION",
            "data_path": "/var/lib/mysql",
            "port": 3306
          },
          "resources": {
            "min_mb": 512,
            "share": 0.2,
            "max_mb": 16384,
            "overhead_mb": 320,
            "panel_mb": 256,
            "exporter_mb": 64,
            "tuning": [
              {
                "env": "MARIADB_MEM_LIMIT",
                "kind": "limit",
                "fmt": "M"
              },
              {
                "env": "MARIADB_BUFFER_POOL",
                "kind": "fraction",
                "factor": 0.6,
                "min_mb": 128,
                "fmt": "M"
              },
              {
                "env": "MARIADB_LOG_FILE_SIZE",
                "kind": "fraction",
                "factor": 0.12,
                "min_mb": 64,
                "max_mb": 2048,
                "fmt": "M"
              },
              {
                "env": "MARIADB_MAX_CONNECTIONS",
                "kind": "per_gb",
                "factor": 125,
                "min": 100,
                "max": 1000,
                "fmt": "int"
              }
            ]
          },
          "plain": {
            "title": "Klasik tablolu veri için en yaygın seçim",
            "detail": "Kullanıcılar, siparişler, ürünler gibi satır-sütun verisi. WordPress, Laravel, çoğu web uygulaması bunu ister.",
            "badge": "En sık kullanılan"
          },
          "failover": {
            "supported": true,
            "mode": "supervised",
            "promote_script": "mariadb",
            "note": "Replika yükseltilir ve yazmaya açılır. Eski primary fence edilir (durdurulur) — iki primary'nin aynı anda yazması (split-brain) böyle engellenir."
          },
          "route": [
            {
              "listen": 3306,
              "upstream_port": 3306
            }
          ],
          "license": {
            "name": "GPL-2.0",
            "free_for_production": true,
            "note": "Tam açık kaynak. Kullanımda kısıtlama yok.",
            "alternative": null
          }
        },
        {
          "id": "postgresql",
          "name": "PostgreSQL",
          "icon": "🐘",
          "category": "relational",
          "summary": "Gelişmiş ilişkisel veritabanı. JSONB, GIS, full-text.",
          "profile": "postgresql",
          "primary_service": "postgresql",
          "services": [
            "postgresql",
            "pgadmin",
            "postgres-exporter"
          ],
          "client_ports": [
            {
              "port": 5432,
              "proto": "tcp",
              "label": "PostgreSQL protokolü"
            }
          ],
          "panel": {
            "name": "pgAdmin",
            "port": 8082,
            "services": [
              "pgadmin"
            ]
          },
          "exporter": {
            "service": "postgres-exporter",
            "metrics_path": "/metrics/postgresql",
            "port": 9187,
            "scrape_path": "/metrics"
          },
          "replication": {
            "mode": "primary-replica",
            "profile": "postgresql-replica",
            "replica_service": "postgresql-replica",
            "replica_port": 5433,
            "note": "pg_basebackup + streaming replication. Replika hot-standby (okunabilir)."
          },
          "backup": {
            "supported": true,
            "kind": "logical",
            "ext": "sql.gz"
          },
          "connection": {
            "username": "root",
            "database": "defaultdb",
            "password_env": "POSTGRES_PASSWORD"
          },
          "k8s": {
            "image_env": "POSTGRES_VERSION",
            "data_path": "/var/lib/postgresql/data",
            "port": 5432
          },
          "resources": {
            "min_mb": 512,
            "share": 0.15,
            "max_mb": 8192,
            "overhead_mb": 576,
            "panel_mb": 512,
            "exporter_mb": 64,
            "tuning": [
              {
                "env": "POSTGRES_MEM_LIMIT",
                "kind": "limit",
                "fmt": "M"
              },
              {
                "env": "POSTGRES_SHARED_BUFFERS",
                "kind": "fraction",
                "factor": 0.25,
                "min_mb": 128,
                "fmt": "MB"
              },
              {
                "env": "POSTGRES_EFFECTIVE_CACHE",
                "kind": "fraction",
                "factor": 0.6,
                "min_mb": 256,
                "fmt": "MB"
              },
              {
                "env": "POSTGRES_MAX_CONNECTIONS",
                "kind": "per_gb",
                "factor": 100,
                "min": 50,
                "max": 400,
                "fmt": "int"
              },
              {
                "env": "POSTGRES_WORK_MEM",
                "kind": "workmem",
                "fmt": "MB"
              }
            ]
          },
          "plain": {
            "title": "Tablolu veri + gelişmiş özellikler",
            "detail": "MariaDB ile aynı işi yapar; JSON, harita/konum verisi ve karmaşık sorgularda daha güçlüdür.",
            "badge": "En sık kullanılan"
          },
          "failover": {
            "supported": true,
            "mode": "supervised",
            "promote_script": "postgresql",
            "note": "Standby pg_ctl promote ile primary olur. Eski primary fence edilir; geri döndüğünde otomatik primary OLMAZ, replika olarak yeniden kurulur."
          },
          "route": [
            {
              "listen": 5432,
              "upstream_port": 5432
            }
          ],
          "license": {
            "name": "PostgreSQL License",
            "free_for_production": true,
            "note": "BSD benzeri, en serbest lisanslardan biri. Kısıtlama yok.",
            "alternative": null
          }
        },
        {
          "id": "mongodb",
          "name": "MongoDB",
          "icon": "🍃",
          "category": "document",
          "summary": "Doküman veritabanı. Şemasız JSON/BSON kayıtlar.",
          "profile": "mongodb",
          "primary_service": "mongodb",
          "services": [
            "mongodb",
            "mongo-express",
            "mongodb-exporter"
          ],
          "client_ports": [
            {
              "port": 27017,
              "proto": "tcp",
              "label": "MongoDB protokolü"
            }
          ],
          "panel": {
            "name": "Mongo Express",
            "port": 8083,
            "services": [
              "mongo-express"
            ]
          },
          "exporter": {
            "service": "mongodb-exporter",
            "metrics_path": "/metrics/mongodb",
            "port": 9216,
            "scrape_path": "/metrics"
          },
          "replication": {
            "mode": "replica-set",
            "profile": "mongodb-replica",
            "replica_service": "mongodb-replica-1",
            "replica_port": 27018,
            "note": "Replica set (rs0). Primary de --replSet ile yeniden başlar — kesinti olur.",
            "extra_services": [
              "mongodb-arbiter"
            ]
          },
          "backup": {
            "supported": true,
            "kind": "dump",
            "ext": "tar.gz"
          },
          "connection": {
            "username": "root",
            "database": "admin",
            "password_env": "MONGO_PASSWORD"
          },
          "k8s": {
            "image_env": "MONGO_VERSION",
            "data_path": "/data/db",
            "port": 27017
          },
          "resources": {
            "min_mb": 512,
            "share": 0.15,
            "max_mb": 8192,
            "overhead_mb": 320,
            "panel_mb": 256,
            "exporter_mb": 64,
            "tuning": [
              {
                "env": "MONGO_MEM_LIMIT",
                "kind": "limit",
                "fmt": "M"
              },
              {
                "env": "MONGO_WIREDTIGER_CACHE_GB",
                "kind": "fraction",
                "factor": 0.5,
                "min_mb": 256,
                "fmt": "G_half"
              }
            ]
          },
          "plain": {
            "title": "Sabit şeması olmayan kayıtlar için",
            "detail": "Her kaydın alanları farklı olabilir. Ürün katalogları, form yanıtları, IoT kayıtları gibi değişken veriler.",
            "badge": null
          },
          "failover": {
            "supported": true,
            "mode": "native",
            "promote_script": null,
            "note": "MongoDB kendi seçimini yapar. Çoğunluk gerektiği için 3. üye olarak bir arbiter eklenir — 2 üyeyle biri düşünce çoğunluk kaybolur ve seçim yapılamaz."
          },
          "route": [
            {
              "listen": 27017,
              "upstream_port": 27017
            }
          ],
          "license": {
            "name": "SSPL-1.0",
            "free_for_production": "copyleft",
            "note": "4.0'dan beri SSPL. OSI onaylı 'açık kaynak' DEĞİL. Kendi işiniz için kullanmak serbesttir; MongoDB'yi bir SERVİS olarak üçüncü taraflara sunarsanız tüm hizmet yığınınızı açmanız istenir.",
            "alternative": "FerretDB (Apache-2.0)"
          }
        },
        {
          "id": "redis",
          "name": "Redis",
          "icon": "🔴",
          "category": "keyvalue",
          "summary": "In-memory key-value store. Cache, kuyruk, oturum.",
          "profile": "redis",
          "primary_service": "redis",
          "services": [
            "redis",
            "redis-insight",
            "redis-exporter"
          ],
          "client_ports": [
            {
              "port": 6379,
              "proto": "tcp",
              "label": "RESP protokolü"
            }
          ],
          "panel": {
            "name": "RedisInsight",
            "port": 8084,
            "services": [
              "redis-insight"
            ]
          },
          "exporter": {
            "service": "redis-exporter",
            "metrics_path": "/metrics/redis",
            "port": 9121,
            "scrape_path": "/metrics"
          },
          "replication": {
            "mode": "primary-replica",
            "profile": "redis-replica",
            "replica_service": "redis-replica",
            "replica_port": 6380,
            "note": "replicaof ile anlık. Kesinti yok, replika read-only."
          },
          "backup": {
            "supported": true,
            "kind": "snapshot",
            "ext": "rdb.gz"
          },
          "connection": {
            "username": "default",
            "database": "0",
            "password_env": "REDIS_PASSWORD"
          },
          "k8s": {
            "image_env": "REDIS_VERSION",
            "data_path": "/data",
            "port": 6379
          },
          "resources": {
            "min_mb": 128,
            "share": 0.08,
            "max_mb": 4096,
            "overhead_mb": 320,
            "panel_mb": 256,
            "exporter_mb": 64,
            "tuning": [
              {
                "env": "REDIS_MEM_LIMIT",
                "kind": "limit",
                "fmt": "M"
              },
              {
                "env": "REDIS_MAXMEMORY",
                "kind": "fraction",
                "factor": 0.65,
                "min_mb": 64,
                "fmt": "mb"
              }
            ]
          },
          "plain": {
            "title": "Hız için geçici bellek deposu",
            "detail": "Kalıcı veri deposu değildir. Oturum bilgisi, önbellek ve iş kuyruğu için kullanılır; uygulamayı belirgin hızlandırır.",
            "badge": "Genelde başka bir DB ile birlikte"
          },
          "failover": {
            "supported": true,
            "mode": "supervised",
            "promote_script": "redis",
            "note": "REPLICAOF NO ONE ile replika primary olur. Redis Sentinel'e gerek kalmaz; aynı işi controller yapar."
          },
          "route": [
            {
              "listen": 6379,
              "upstream_port": 6379
            }
          ],
          "license": {
            "name": "AGPL-3.0 / RSALv2 / SSPL",
            "free_for_production": "copyleft",
            "note": "7.4 ile RSALv2+SSPL'e geçti, 8.0 ile üçüncü seçenek olarak AGPL-3.0 eklendi. Pinlenen 8-alpine AGPL kapsamındadır. Copyleft istemiyorsanız Valkey birebir yerine geçer: REDIS_IMAGE=valkey/valkey:8-alpine",
            "alternative": "Valkey (BSD-3, birebir uyumlu)"
          }
        },
        {
          "id": "mssql",
          "name": "SQL Server",
          "icon": "🟥",
          "category": "relational",
          "summary": "Microsoft SQL Server 2022 Developer. T-SQL iş yükleri.",
          "profile": "mssql",
          "primary_service": "mssql",
          "services": [
            "mssql"
          ],
          "client_ports": [
            {
              "port": 1433,
              "proto": "tcp",
              "label": "TDS protokolü"
            }
          ],
          "panel": {
            "name": "Adminer",
            "port": 8085,
            "path": "/?mssql=mssql&username=sa&db=master",
            "shared": true
          },
          "exporter": null,
          "replication": {
            "mode": "unsupported",
            "note": "Always On AG tek container'da kurulamaz; ayrı node'lar + Enterprise/Developer cluster gerekir."
          },
          "backup": {
            "supported": true,
            "kind": "native",
            "ext": "tar.gz"
          },
          "connection": {
            "username": "sa",
            "database": "master",
            "password_env": "MSSQL_PASSWORD"
          },
          "k8s": {
            "image_env": "MSSQL_VERSION",
            "data_path": "/var/opt/mssql",
            "port": 1433
          },
          "resources": {
            "min_mb": 2048,
            "share": 0.22,
            "max_mb": 16384,
            "overhead_mb": 0,
            "panel_mb": 0,
            "exporter_mb": 0,
            "tuning": [
              {
                "env": "MSSQL_MEM_LIMIT",
                "kind": "limit",
                "fmt": "M"
              },
              {
                "env": "MSSQL_MEMORY_LIMIT_MB",
                "kind": "fraction",
                "factor": 0.8,
                "min_mb": 1024,
                "fmt": "int_mb"
              }
            ]
          },
          "plain": {
            "title": "Microsoft dünyası uygulamaları için",
            "detail": ".NET / Windows tabanlı kurumsal uygulamalar genelde bunu ister. Diğerlerinden daha çok RAM tüketir.",
            "badge": null
          },
          "failover": {
            "supported": false,
            "mode": "none",
            "promote_script": null,
            "note": "Always On AG ayrı node'lar ve Windows/Linux cluster ister; tek makinede kurulamaz."
          },
          "route": [
            {
              "listen": 1433,
              "upstream_port": 1433
            }
          ],
          "license": {
            "name": "Developer Edition — YALNIZ GELİŞTİRME/TEST",
            "free_for_production": false,
            "note": "⚠️ Varsayılan MSSQL_PID=Developer üretimde KULLANILAMAZ; yalnız geliştirme ve test için ücretsizdir. Üretim için MSSQL_PID=Express (ücretsiz, veritabanı başına 10 GB) ya da Standard/Enterprise lisansı gerekir.",
            "alternative": "MSSQL_PID=Express (ücretsiz, 10 GB/DB sınırı) ya da satın alınmış lisans"
          }
        },
        {
          "id": "cassandra",
          "name": "Cassandra",
          "icon": "🌀",
          "category": "widecolumn",
          "summary": "Dağıtık wide-column store. Yüksek yazma hacmi, lineer ölçek.",
          "profile": "cassandra",
          "primary_service": "cassandra",
          "services": [
            "cassandra",
            "cassandra-exporter"
          ],
          "client_ports": [
            {
              "port": 9042,
              "proto": "tcp",
              "label": "CQL native"
            }
          ],
          "panel": null,
          "exporter": {
            "service": "cassandra-exporter",
            "metrics_path": "/metrics/cassandra",
            "port": 9500,
            "scrape_path": "/metrics"
          },
          "replication": {
            "mode": "native-cluster",
            "note": "Cassandra'da primary/replica yoktur; keyspace başına replication_factor ile node ekleyerek ölçeklenir."
          },
          "backup": {
            "supported": true,
            "kind": "snapshot",
            "ext": "tar.gz"
          },
          "connection": {
            "username": "cassandra",
            "database": "system",
            "password_env": "CASSANDRA_PASSWORD"
          },
          "k8s": {
            "image_env": "CASSANDRA_VERSION",
            "data_path": "/var/lib/cassandra",
            "port": 9042
          },
          "resources": {
            "min_mb": 1024,
            "share": 0.15,
            "max_mb": 8192,
            "overhead_mb": 128,
            "panel_mb": 0,
            "exporter_mb": 128,
            "tuning": [
              {
                "env": "CASSANDRA_MEM_LIMIT",
                "kind": "limit",
                "fmt": "M"
              },
              {
                "env": "CASSANDRA_HEAP",
                "kind": "fraction",
                "factor": 0.5,
                "min_mb": 256,
                "max_mb": 8192,
                "fmt": "M"
              },
              {
                "env": "CASSANDRA_HEAP_NEW",
                "kind": "fraction",
                "factor": 0.12,
                "min_mb": 100,
                "max_mb": 2048,
                "fmt": "M"
              }
            ]
          },
          "plain": {
            "title": "Çok yüksek yazma hacmi için",
            "detail": "Saniyede on binlerce kayıt yazan sistemler (sensör, tıklama, log). Küçük projeler için gereğinden ağırdır.",
            "badge": null
          },
          "failover": {
            "supported": false,
            "mode": "none",
            "promote_script": null,
            "note": "Cassandra'da primary yoktur; her node eşittir. Dayanıklılık replication_factor ile sağlanır."
          },
          "route": [
            {
              "listen": 9042,
              "upstream_port": 9042
            }
          ],
          "license": {
            "name": "Apache-2.0",
            "free_for_production": true,
            "note": "Tam açık kaynak. Kısıtlama yok.",
            "alternative": null
          }
        },
        {
          "id": "elasticsearch",
          "name": "Elasticsearch",
          "icon": "🔎",
          "category": "search",
          "summary": "Arama ve log analitiği motoru. Kibana ile birlikte gelir.",
          "profile": "elasticsearch",
          "primary_service": "elasticsearch",
          "services": [
            "elasticsearch",
            "elasticsearch-init",
            "kibana",
            "elasticsearch-exporter"
          ],
          "client_ports": [
            {
              "port": 9200,
              "proto": "tcp",
              "label": "REST API"
            }
          ],
          "panel": {
            "name": "Kibana",
            "port": 8086,
            "services": [
              "kibana",
              "elasticsearch-init"
            ]
          },
          "exporter": {
            "service": "elasticsearch-exporter",
            "metrics_path": "/metrics/elasticsearch",
            "port": 9114,
            "scrape_path": "/metrics"
          },
          "replication": {
            "mode": "native-cluster",
            "note": "Index başına number_of_replicas ile. Tek node'da replika ataması yapılamaz (yellow health normaldir)."
          },
          "backup": {
            "supported": true,
            "kind": "snapshot",
            "ext": "tar.gz"
          },
          "connection": {
            "username": "elastic",
            "database": "-",
            "password_env": "ELASTIC_PASSWORD"
          },
          "k8s": {
            "image_env": "ELASTIC_VERSION",
            "data_path": "/usr/share/elasticsearch/data",
            "port": 9200
          },
          "resources": {
            "min_mb": 1024,
            "share": 0.18,
            "max_mb": 16384,
            "overhead_mb": 1088,
            "panel_mb": 1024,
            "exporter_mb": 64,
            "tuning": [
              {
                "env": "ELASTIC_MEM_LIMIT",
                "kind": "limit",
                "fmt": "M"
              },
              {
                "env": "ELASTIC_JAVA_OPTS",
                "kind": "fraction",
                "factor": 0.5,
                "min_mb": 512,
                "max_mb": 31744,
                "fmt": "java"
              }
            ]
          },
          "plain": {
            "title": "Arama ve log incelemesi için",
            "detail": "Site içi arama kutusu, ya da uygulama loglarını toplayıp Kibana'da grafikle inceleme. Yanında Kibana arayüzü gelir.",
            "badge": null
          },
          "failover": {
            "supported": false,
            "mode": "none",
            "promote_script": null,
            "note": "Shard'ların primary/replica ataması küme içinde otomatiktir; tek node'da yapacak bir şey yoktur."
          },
          "route": [
            {
              "listen": 9200,
              "upstream_port": 9200
            }
          ],
          "license": {
