---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: databases-stack
  labels: {app.kubernetes.io/name: neo4j, app.kubernetes.io/part-of: databases-stack}
spec:
  # replicas: 0 → motor KAPALI. Dashboard'daki "Aktif Et" bunu 1 yapar.
  replicas: 0
  serviceName: neo4j
  selector:
    matchLabels: {app.kubernetes.io/name: neo4j}
  template:
    metadata:
      labels: {app.kubernetes.io/name: neo4j}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: neo4j
        image: neo4j:5-community
        imagePullPolicy: IfNotPresent
        ports:
        - name: client
          containerPort: 7687
        env:
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: NEO4J_AUTH
        - name: NEO4J_server_memory_heap_max__size
          value: "512m"
        - name: NEO4J_server_memory_pagecache_size
          value: "512m"
        resources:
          requests:
            memory: "768Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: databases-stack
  labels: {app.kubernetes.io/name: neo4j}
spec:
  selector: {app.kubernetes.io/name: neo4j}
  ports:
  - name: bolt
    port: 7687
    targetPort: 7687
