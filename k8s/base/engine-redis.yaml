---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: databases-stack
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: databases-stack}
spec:
  # replicas: 0 → motor KAPALI. Dashboard'daki "Aktif Et" bunu 1 yapar.
  replicas: 0
  serviceName: redis
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: redis
        image: redis:8-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: client
          containerPort: 6379
        args:
        - "redis-server"
        - "--requirepass"
        - "$(REDISCLI_AUTH)"
        - "--appendonly"
        - "yes"
        - "--maxmemory"
        - "$(REDIS_MAXMEMORY)"
        - "--maxmemory-policy"
        - "$(REDIS_MAXMEMORY_POLICY)"
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: REDIS_PASSWORD
        - name: REDIS_MAXMEMORY
          value: "384mb"
        - name: REDIS_MAXMEMORY_POLICY
          value: "allkeys-lru"
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: databases-stack
  labels: {app.kubernetes.io/name: redis}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports:
  - name: resp
    port: 6379
    targetPort: 6379
