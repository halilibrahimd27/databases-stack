---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  namespace: databases-stack
  labels: {app.kubernetes.io/name: mssql, app.kubernetes.io/part-of: databases-stack}
spec:
  # replicas: 0 → motor KAPALI. Dashboard'daki "Aktif Et" bunu 1 yapar.
  replicas: 0
  serviceName: mssql
  selector:
    matchLabels: {app.kubernetes.io/name: mssql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mssql}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: mssql
        image: mcr.microsoft.com/mssql/server:2022-latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: client
          containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_PID
          value: "Developer"
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: MSSQL_PASSWORD
        - name: MSSQL_MEMORY_LIMIT_MB
          value: "2048"
        resources:
          requests:
            memory: "2048Mi"
            cpu: "100m"
          limits:
            memory: "2048Mi"
        volumeMounts:
        - name: data
          mountPath: /var/opt/mssql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: databases-stack
  labels: {app.kubernetes.io/name: mssql}
spec:
  selector: {app.kubernetes.io/name: mssql}
  ports:
  - name: tds
    port: 1433
    targetPort: 1433
