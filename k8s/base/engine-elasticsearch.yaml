---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: databases-stack
  labels: {app.kubernetes.io/name: elasticsearch, app.kubernetes.io/part-of: databases-stack}
spec:
  # replicas: 0 → motor KAPALI. Dashboard'daki "Aktif Et" bunu 1 yapar.
  replicas: 0
  serviceName: elasticsearch
  selector:
    matchLabels: {app.kubernetes.io/name: elasticsearch}
  template:
    metadata:
      labels: {app.kubernetes.io/name: elasticsearch}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: client
          containerPort: 9200
        env:
        - name: discovery.type
          value: "single-node"
        - name: xpack.security.enabled
          value: "true"
        - name: xpack.security.http.ssl.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: ELASTIC_PASSWORD
        resources:
          requests:
            memory: "1024Mi"
            cpu: "100m"
          limits:
            memory: "1024Mi"
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: databases-stack
  labels: {app.kubernetes.io/name: elasticsearch}
spec:
  selector: {app.kubernetes.io/name: elasticsearch}
  ports:
  - name: rest
    port: 9200
    targetPort: 9200
